name: brand-sync
# Pulls interlace.tools/brand.json into relay/brand.json and commits to main when it changed,
# so a brand line or a number moving needs no PR in this repo.
on:
  schedule:
    - cron: "30 20 * * *" # after the profile stats refresh (20:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/sync-brand.mjs
      - run: npm ci
      - run: npm test
      - name: Commit if changed
        run: |
          git diff --quiet -- relay/brand.json && { echo "brand unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync brand from interlace.tools" -- relay/brand.json
          git push
