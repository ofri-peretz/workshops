name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: console
      - name: Scrub and Relay self-check
        run: npm test
      - name: Unit tests of the room's rules
        run: npm run unit
      - name: Quint model (witnesses, then random runs against the invariants)
        run: npm run spec
      - name: OpenAPI contract
        run: npm run contract
      - name: Mutation score (oxmutate; breaks under 85%)
        run: npm run mutate
      - name: Console types
        run: npx tsc --noEmit
        working-directory: console
      - name: Responsive, at five widths (installed Chrome)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
