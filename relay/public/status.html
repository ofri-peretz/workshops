<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Relay Status</title>
    <style>
      :root {
        --bg: #faf7f4;
        --card: #fff;
        --fg: #0d0b09;
        --muted: #4d453c;
        --line: #eae7e2;
        --quiet: #f5f3f0;
        --good: #065f46;
        --warn: #78350f;
        --bad: #991b1b;
        --good-bg: #ffffff; /* kit card: status colour stays on the text */
        --warn-bg: #ffffff;
        --bad-bg: #ffffff;
        --ok-bar: #065f46;
        --sans: "Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171412;
          --fg: #f0ede9;
          --muted: #c9c3bb;
          --line: #252019;
          --quiet: #201c17;
          --good: #34d399;
          --warn: #f59e0b;
          --bad: #fca5a5;
          --good-bg: #171412;
          --warn-bg: #171412;
          --bad-bg: #171412;
          --ok-bar: #34d399;
          color-scheme: dark;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.45 var(--sans);
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: calc(env(safe-area-inset-top, 0px) + 20px)
          max(16px, env(safe-area-inset-right, 0px)) 40px
          max(16px, env(safe-area-inset-left, 0px));
        display: grid;
        gap: 18px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .banner {
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 19px;
        font-weight: 700;
      }
      .banner.good {
        background: var(--good-bg);
        color: var(--good);
      }
      .banner.warn {
        background: var(--warn-bg);
        color: var(--warn);
      }
      .banner.bad {
        background: var(--bad-bg);
        color: var(--bad);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .comp {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 10px;
      }
      .comp:last-child {
        border: 0;
        padding: 0;
      }
      .st {
        font-size: 14px;
        font-weight: 600;
      }
      .st.good {
        color: var(--good);
      }
      .st.warn {
        color: var(--warn);
      }
      .st.bad {
        color: var(--bad);
      }
      .days {
        display: grid;
        grid-template-columns: repeat(90, 1fr);
        gap: 2px;
        height: 34px;
      }
      .days i {
        border-radius: 2px;
        background: var(--ok-bar);
      }
      .days i.part {
        background: var(--warn);
      }
      .days i.out {
        background: var(--bad);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        font: 500 12px var(--mono);
        color: var(--muted);
      }
      .inc h3 {
        margin: 0;
        font-size: 17px;
      }
      .inc p {
        margin: 4px 0 0;
      }
      .inc time {
        font: 500 12px var(--mono);
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Relay Status</h1>
      <div class="banner good" id="banner" role="status">Loading…</div>
      <section class="card" aria-label="Components" id="comps"></section>
      <section class="card" aria-label="Uptime, last 90 days">
        <div class="meta">
          <span>Chat API · last 90 days</span><span id="u90"></span>
        </div>
        <div class="days" id="days"></div>
        <div class="meta"><span>90 days ago</span><span>Today</span></div>
      </section>
      <section class="card" aria-label="Incidents">
        <b>Incidents</b>
        <div id="incs"></div>
      </section>
      <p class="muted">
        Days before today are sample history for the workshop. Today is live:
        every message and request in this room.
      </p>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const tone = (st) =>
        st === "Operational" || st.startsWith("All")
          ? "good"
          : st.startsWith("Degraded")
            ? "warn"
            : "bad";
      const time = (t) =>
        new Date(t).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      async function load() {
        try {
          const res = await fetch("/api/status", { cache: "no-store" });
          if (res.status === 403) {
            $("banner").className = "banner";
            $("banner").textContent = "This workshop isn't running right now.";
            return;
          }
          const s = await res.json();
          $("banner").className = "banner " + tone(s.overall);
          $("banner").textContent = s.overall;
          $("comps").innerHTML = s.components
            .map(
              (c) =>
                `<div class="comp"><span>${esc(c.name)}</span><span class="st ${tone(c.status)}">${esc(c.status)}</span></div>`,
            )
            .join("");
          $("u90").textContent = (100 * s.uptime90).toFixed(3) + "% uptime";
          $("days").innerHTML = s.days
            .map(
              (d, i) =>
                `<i class="${d < 0.995 ? "out" : d < 0.9999 ? "part" : ""}" title="${i === s.days.length - 1 ? "Today" : 89 - i + " days ago"}: ${(100 * d).toFixed(2)}%"></i>`,
            )
            .join("");
          $("incs").innerHTML = s.incidents.length
            ? s.incidents
                .map(
                  (inc) =>
                    `<div class="inc card"><h3>${esc(inc.title)}</h3><time>${time(inc.start)}${inc.end ? " – " + time(inc.end) : " · ongoing"}</time>${inc.updates
                      .slice()
                      .reverse()
                      .map(
                        (u) =>
                          `<p><time>${time(u.at)}</time> ${esc(u.text)}</p>`,
                      )
                      .join("")}</div>`,
                )
                .join("")
            : `<p class="muted">No incidents today.</p>`;
        } catch {
          $("banner").className = "banner warn";
          $("banner").textContent = "Can't reach Relay's status service";
        }
      }
      load();
      setInterval(load, 3000);
    </script>
  </body>
</html>
