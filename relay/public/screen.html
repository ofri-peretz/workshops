<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workshop — big screen</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      /* Projector = the deck. One scene at a time, the room's live answers drawn in, presenter bar below.
   Interlace tokens (brand/claude-design/tokens.css): one warm accent; charts use the kit's chart-1 and chart-2. */
      :root {
        --bg: #faf7f4;
        --card: #fff;
        --fg: #0d0b09;
        --muted: #4d453c;
        --faint: #4d453c; /* kit muted-foreground */
        --line: #eae7e2;
        --quiet: #f5f3f0;
        --primary: #7d350c;
        --primary-fg: #fff;
        --primary-subtle: #fef4ed;
        --strand: oklch(0.55 0.16 41);
        --c1: oklch(0.55 0.16 41); /* kit chart-1 */
        --c2: oklch(0.55 0.14 162); /* kit chart-2 */
        --mark-o: #a84c17; /* the Interlace mark: orange leads, green follows */
        --mark-g: #0a6b47;
        --good: #065f46;
        --bad: #991b1b;
        --good-bg: #ffffff; /* kit card: status colour stays on the text */
        --bad-bg: #ffffff;
        --sans: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171412;
          --fg: #f0ede9;
          --muted: #c9c3bb;
          --faint: #c9c3bb;
          --line: #252019;
          --quiet: #201c17;
          --primary: #fbb99a;
          --primary-fg: #0a0a0a;
          --primary-subtle: #3d1a08;
          --strand: oklch(0.78 0.14 41);
          --c1: oklch(0.78 0.14 41);
          --c2: oklch(0.78 0.12 162);
          --mark-o: #f4794a;
          --mark-g: #0d9460;
          --good: #34d399;
          --bad: #fca5a5;
          --good-bg: #171412;
          --bad-bg: #171412;
          color-scheme: dark;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 18px/1.45 var(--sans);
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 14px 36px;
        border-bottom: 2px solid var(--strand);
      }
      .top .mark {
        width: 30px;
        height: 30px;
        flex: none;
      }
      .top .brand {
        font: 600 18px var(--mono);
        letter-spacing: -0.02em;
        margin-left: -8px;
      }
      .fork {
        display: grid;
        gap: 12px;
      }
      .fork .opt {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
      }
      .fork button {
        font: 600 14px var(--sans);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid var(--primary);
        background: var(--card);
        color: var(--primary);
        cursor: pointer;
      }
      .metrics3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      .metrics3 .g { display: grid; gap: 8px; align-content: start; }
      .spark { width: 100%; height: 70px; }
      .logs { display: grid; gap: 6px; max-height: 62vh; overflow: hidden; }
      .logline { display: block; font: 15px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; padding: 6px 10px; border-radius: 8px; background: var(--quiet); }
      .logline.warn { box-shadow: inset 4px 0 0 var(--c1); }
      .logline.error { box-shadow: inset 4px 0 0 var(--bad); }
      .series {
        display: grid;
        gap: 8px;
        font-size: 15px;
      }
      .series .g {
        padding: 10px 14px;
        gap: 2px;
      }
      .series .g.on {
        border-color: var(--primary);
        background: var(--primary-subtle);
      }
      .top b {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .top .where {
        font: 500 13px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .top .spacer {
        flex: 1;
      }
      .top .join {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 500 15px var(--mono);
        color: var(--fg);
      }
      #qrs {
        background: #fff;
        padding: 4px;
        border-radius: 6px;
      }
      #qrs img,
      #qrs canvas {
        width: 64px;
        height: 64px;
        display: block;
      }
      .people {
        text-align: right;
      }
      .people b {
        display: block;
        font-size: 28px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .people span {
        font-size: 12px;
        color: var(--muted);
      }
      #stage {
        padding: 28px 36px;
        display: grid;
        align-content: start;
        gap: 22px;
        overflow: auto;
      }
      h1 {
        margin: 0;
        font-size: clamp(30px, 3.6vw, 52px);
        line-height: 1.08;
        letter-spacing: -0.02em;
        font-weight: 800;
        text-wrap: balance;
        max-width: 26ch;
      }
      .lead {
        margin: 0;
        font-size: clamp(18px, 1.6vw, 24px);
        max-width: 60ch;
        border-left: 4px solid var(--strand);
        padding-left: 16px;
      }
      .muted {
        color: var(--muted);
      }
      .grid2 {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 32px;
        align-items: start;
      }
      .big {
        font-size: clamp(56px, 7vw, 110px);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .label {
        font: 500 13px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .bars {
        display: grid;
        gap: 12px;
      }
      .bar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 70px;
        gap: 12px;
        align-items: center;
      }
      .bar .t {
        position: relative;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--quiet);
        overflow: hidden;
        min-width: 0;
      }
      .bar .t i {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--primary-subtle);
        border-right: 3px solid var(--c1);
      }
      .bar .t span {
        position: relative;
      }
      .bar.right .t i {
        background: var(--good-bg);
        border-color: var(--good);
      }
      .bar.right .t span::before {
        content: "✓ ";
        color: var(--good);
        font-weight: 700;
      }
      .bar b {
        font-size: 26px;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      .groups {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .g {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        display: grid;
        gap: 6px;
      }
      .g h3 {
        margin: 0;
        font-size: 30px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }
      svg text {
        font: 13px var(--mono);
        fill: var(--muted);
      }
      .cells {
        display: grid;
        grid-template-columns: repeat(20, 1fr);
        gap: 4px;
        max-width: 760px;
      }
      .cells i {
        aspect-ratio: 1;
        border-radius: 3px;
        background: var(--quiet);
      }
      .cells i.ok {
        background: var(--c2);
      }
      .cells i.err {
        background: var(--bad);
      }
      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        text-align: left;
        padding: 8px 22px 8px 0;
        border-bottom: 1px solid var(--line);
      }
      th {
        font: 500 13px var(--mono);
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.05em;
      }
      .checks {
        display: grid;
        gap: 14px;
        font-size: 24px;
      }
      .checks div::before {
        content: "□  ";
        color: var(--c1);
      }
      .timer { font: 700 clamp(28px, 3vw, 48px)/1 var(--mono); padding: 6px 16px; border-radius: 12px; border: 2px solid var(--line); }
      .timer.low { border-color: var(--primary, currentColor); }
      .timer.done { opacity: 0.7; }
      .findme {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 18px;
        align-items: center;
      }
      .findme #qrhome {
        padding: 8px;
        background: #fff;
        border-radius: 8px;
        line-height: 0;
      }
      .checks.intro {
        font-size: clamp(18px, 1.5vw, 22px);
        gap: 10px;
      }
      .checks.intro div::before {
        content: "—  ";
      }
      .checks.next div::before {
        content: "→  ";
      }
      #keys { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--fg); padding: 28px 32px; max-width: min(560px, 92vw); }
      #keys::backdrop { background: rgb(0 0 0 / 0.6); }
      #keys h2 { margin: 0 0 16px; font-size: 24px; }
      #keys table { border-collapse: collapse; width: 100%; font-size: 18px; }
      #keys th, #keys td { text-align: left; padding: 8px 0; border-top: 1px solid var(--line); }
      #keys th { padding-right: 24px; white-space: nowrap; font-weight: 500; }
      #keys kbd { font-family: var(--mono); }
      .chips { display: flex; flex-wrap: wrap; gap: 10px; }
      .chips span { border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; font-family: var(--mono); font-size: clamp(18px, 1.6vw, 26px); }
      .remember { margin-top: 16px; font-size: clamp(24px, 2.2vw, 34px); font-weight: 600; border-left: 4px solid var(--primary, currentColor); padding-left: 16px; }
      .case { margin-top: 24px; font-size: clamp(20px, 1.8vw, 28px); color: var(--muted); }
      .qrbig {
        background: #fff;
        padding: 14px;
        border-radius: 14px;
        justify-self: start;
      }
      .qrbig img,
      .qrbig canvas {
        width: 240px;
        height: 240px;
        display: block;
      }
      .url {
        font: 500 30px var(--mono);
      }
      .pill {
        display: inline-block;
        font-size: 15px;
        font-weight: 700;
        border-radius: 99px;
        padding: 4px 12px;
      }
      .pill.bad {
        color: var(--bad);
        background: var(--bad-bg);
      }
      .pill.good {
        color: var(--good);
        background: var(--good-bg);
      }
      .bottom {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 10px 36px 14px;
        border-top: 1px solid var(--line);
        background: var(--card);
      }
      .bottom button {
        font: 600 14px var(--sans);
        border-radius: 8px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      .bottom button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
      }
      .bottom button.danger {
        color: var(--bad);
      }
      .bottom button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .bottom .clock {
        font: 500 13px var(--mono);
        color: var(--muted);
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      .aud {
        font: 500 13px var(--mono);
        color: var(--muted);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .aud select {
        font: 500 13px var(--sans);
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
      }
      #notes {
        padding: 0 36px 14px;
        background: var(--card);
        font-size: 15px;
        color: var(--muted);
      }
      /* Motion: one gentle entrance per slide, never looping; off when the viewer asks for less. */
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
      #stage.enter > *, #stage.enter .grid2 > *, #stage.enter .series > *, #stage.enter .checks > * { animation: rise 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      #stage.enter > *:nth-child(2), #stage.enter .grid2 > *:nth-child(2), #stage.enter .series > *:nth-child(2), #stage.enter .checks > *:nth-child(2) { animation-delay: 70ms; }
      #stage.enter > *:nth-child(3), #stage.enter .series > *:nth-child(3), #stage.enter .checks > *:nth-child(3) { animation-delay: 140ms; }
      #stage.enter > *:nth-child(n + 4), #stage.enter .series > *:nth-child(n + 4), #stage.enter .checks > *:nth-child(n + 4) { animation-delay: 210ms; }
      .bump { display: inline-block; animation: bump 600ms ease-out; }
      /* The audience sees content: the control bar fades away when the mouse is still. */
      .bottom, #notes { transition: opacity 300ms ease; }
      body.idle .bottom { opacity: 0; pointer-events: none; }
      body.idle { cursor: none; }
      @media (prefers-reduced-motion: reduce) {
        #stage.enter *, .bump { animation: none !important; }
        .bottom, #notes { transition: none; }
      }
      /* One idea per slide: big title, a few big lines. */
      .focus { display: grid; gap: 14px; max-width: 1400px; }
      .focus h1 { font-size: clamp(64px, 8vw, 132px); line-height: 0.95; margin: 0; }
      .focus .tag { font-size: clamp(28px, 2.6vw, 44px); margin: 0 0 18px; color: var(--muted); }
      .parts { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(10px, 1.4vh, 20px); counter-reset: p; }
      .parts li { counter-increment: p; display: grid; grid-template-columns: clamp(44px, 3.4vw, 64px) clamp(240px, 17vw, 360px) 1fr; align-items: baseline; gap: 16px; font-size: clamp(28px, 2.6vw, 46px); }
      .parts li::before { content: counter(p); font-weight: 700; color: var(--primary); }
      .parts li span { color: var(--muted); }
      .parts small.terms { display: block; font: 500 clamp(16px, 1.2vw, 22px)/1.4 var(--mono); color: var(--muted); opacity: 0.8; margin-top: 4px; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 12px; }
      .card-case { display: grid; gap: 10px; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); transition: border-color 300ms ease; }
      .card-case b { font-size: clamp(26px, 2.2vw, 38px); }
      .card-case span { font-size: clamp(18px, 1.5vw, 26px); color: var(--muted); }
      .card-case.lead { border-color: var(--primary); }
      .votes { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
      .votes i { display: block; height: 10px; border-radius: 999px; background: var(--primary); transition: width 400ms ease; min-width: 4px; }
      .votes em { font: 700 clamp(26px, 2vw, 36px)/1 var(--mono); font-style: normal; }
      .focus { max-width: none; }
      .cover3 { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: clamp(20px, 3vw, 56px); align-items: start; }
      .cover3 section { display: grid; gap: 14px; align-content: start; }
      .clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: clamp(22px, 1.9vw, 34px); }
      ol.clean { counter-reset: c; } ol.clean li { counter-increment: c; } ol.clean li::before { content: counter(c); color: var(--primary); font-weight: 700; display: inline-block; min-width: 1.4em; }
      .asks li { color: var(--fg); } .asks li::before { content: "→ "; color: var(--primary); }
      /* The waiting screen, designed for the room. */
      .welcome { display: grid; grid-template-columns: 1.15fr 1fr; gap: clamp(24px, 4vw, 64px); align-items: start; }
      .welcome .who { display: flex; gap: 20px; align-items: center; }
      .welcome .who img { width: clamp(88px, 7vw, 128px); height: auto; border-radius: 50%; }
      .welcome .who b { font-size: clamp(24px, 2vw, 34px); display: block; }
      .welcome h1 { font-size: clamp(64px, 8vw, 132px); line-height: 0.95; margin: 8px 0; }
      .welcome .tag { font-size: clamp(26px, 2.4vw, 40px); margin: 0; }
      .welcome ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; counter-reset: p; }
      .welcome ol li { counter-increment: p; display: grid; grid-template-columns: 40px 1fr; font-size: clamp(20px, 1.6vw, 28px); }
      .welcome ol li::before { content: counter(p); font-weight: 700; color: var(--primary); }
      .welcome ol li span { color: var(--muted); }
      .welcome ol li b { color: var(--fg); }
      .welcome .joinbox { display: grid; gap: 16px; justify-items: center; text-align: center; }
      .welcome .here { font-size: clamp(28px, 2.6vw, 44px); font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="top">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-30 50 50)"><rect x="10" y="18" width="62" height="28" rx="14" fill="var(--mark-o)" /><rect x="28" y="54" width="62" height="28" rx="14" fill="var(--mark-g)" /></g></svg
      ><span class="brand">interlace</span><b>Workshops</b><span class="where" id="where"></span><span class="timer" id="timer" hidden></span
      ><span class="spacer"></span>
      <span class="join"
        ><span id="joinurl"></span><span id="qrs" aria-hidden="true"></span
      ></span>
      <div class="people"><b id="deeper">0</b><span>go deeper</span></div>
      <div class="people"><b id="people">0</b><span>phones</span></div>
    </div>
    <main id="stage" aria-live="polite"></main>
    <div>
      <div class="bottom" role="toolbar" aria-label="Presenter controls">
        <button type="button" data-op="prev">← Prev</button
        ><button type="button" class="primary" data-op="next">Next →</button>
        <button type="button" data-op="reveal">Reveal (R)</button
        ><button type="button" data-op="groups">Reveal groups (G)</button>
        <button type="button" class="danger" data-op="break">
          Break Relay (B)</button
        ><button type="button" data-op="fix">Fix Relay (F)</button
        ><button type="button" data-op="instrument">Add span (A)</button>
        <button type="button" id="notesBtn" aria-pressed="false">
          Notes (N)</button
        ><button type="button" id="keysBtn" aria-haspopup="dialog">Keys (?)</button
        ><button type="button" id="reset">Reset room</button
        ><button type="button" data-start="5">Start Signals</button
        ><button type="button" data-start="1">Start workshop 1</button
        ><button type="button" data-start="2">Start workshop 2</button
        ><button type="button" data-start="3">Start workshop 3</button
        ><button type="button" data-start="4">Start workshop 4</button>
        <label class="aud" for="aud">Audience <select id="aud"></select></label>
        <label class="aud" for="lib">Library <select id="lib"></select></label>
        <span class="clock" id="clock"></span>
      </div>
      <div id="notes" hidden></div>
    </div>

    <dialog id="keys" aria-labelledby="keysTitle">
      <h2 id="keysTitle">Keyboard shortcuts</h2>
      <table><tr><th scope="row"><kbd>→ or PageDown</kbd></th><td>Next scene (a clicker works)</td></tr><tr><th scope="row"><kbd>← or PageUp</kbd></th><td>Back</td></tr><tr><th scope="row"><kbd>R</kbd></th><td>Reveal the answer</td></tr><tr><th scope="row"><kbd>G</kbd></th><td>Reveal the speed groups</td></tr><tr><th scope="row"><kbd>B</kbd></th><td>Break Relay</td></tr><tr><th scope="row"><kbd>F</kbd></th><td>Fix Relay</td></tr><tr><th scope="row"><kbd>A</kbd></th><td>Add span</td></tr><tr><th scope="row"><kbd>N</kbd></th><td>Speaker notes (the room sees them)</td></tr><tr><th scope="row"><kbd>? or ⌘/</kbd></th><td>This list</td></tr><tr><th scope="row"><kbd>Esc</kbd></th><td>Close this list</td></tr></table>
    </dialog>
    <script>
      const T = new URLSearchParams(location.search).get("t");
      // Phones join on the chat host; the projector may be on its own (screen.) host. The presenter's
      // console passes the public address and the join code (?join=…&c=…); the QR carries both.
      const Q = new URLSearchParams(location.search);
      const JOIN = Q.get("join") || location.origin.replace("//screen.", "//chat.") + "/";
      const CODE = /^\d{6}$/.test(Q.get("c") || "") ? Q.get("c") : "";
      const JOIN_QR = CODE ? JOIN + "?c=" + CODE : JOIN;
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fmt = (ms) =>
        ms == null
          ? "—"
          : ms >= 1000
            ? (ms / 1000).toFixed(1) + " s"
            : Math.round(ms) + " ms";
      const gname = (ms, shown, i) =>
        shown ? (ms < 1000 ? "0.1 s" : ms / 1000 + " s") : "Group " + "ABCD"[i];
      $("joinurl").textContent = JOIN.replace(/^https?:\/\//, "") + (CODE ? "  ·  code " + CODE : "");
      const qr = (el, size, text = JOIN_QR) => {
        try {
          new QRCode(el, {
            text,
            width: size,
            height: size,
            correctLevel: QRCode.CorrectLevel.M,
          });
        } catch {
          el.hidden = true;
        }
      };
      qr($("qrs"), 64);

      const NINES_ROWS = [
        [99, "3 d 15.6 h", "7 h 12 min", "14 min 24 s"],
        [99.9, "8 h 46 min", "43 min", "1 min 26 s"],
        [99.95, "4 h 23 min", "21 min 36 s", "43 s"],
        [99.99, "53 min", "4 min 19 s", "8.6 s"],
        [99.999, "5 min 15 s", "26 s", "0.9 s"],
      ];

      function bars(options, counts, answer, shown) {
        const max = Math.max(1, ...counts),
          tot = counts.reduce((a, b) => a + b, 0);
        return `<div class="bars">${options.map((o, i) => `<div class="bar ${shown && i === answer ? "right" : ""}"><div class="t"><i style="width:${(100 * counts[i]) / max}%"></i><span>${esc(o)}</span></div><b>${tot ? Math.round((100 * counts[i]) / tot) + "%" : "0"}</b></div>`).join("")}</div>`;
      }
      function gantt() {
        return `<svg viewBox="0 0 900 170" role="img" aria-label="Trace: request 95 ms, database 15 ms, 80 ms with no span">
    <text x="0" y="28">request</text><rect x="120" y="12" width="760" height="24" rx="5" fill="var(--c1)"/><text x="884" y="30" text-anchor="end" style="fill:var(--primary-fg)">95 ms</text>
    <text x="0" y="78">db query</text><rect x="152" y="62" width="120" height="24" rx="5" fill="var(--c2)"/><text x="280" y="80">15 ms</text>
    <text x="0" y="128" style="fill:var(--bad)">?</text><rect x="276" y="112" width="600" height="24" rx="5" fill="none" stroke="var(--bad)" stroke-dasharray="6 4"/><text x="560" y="130" text-anchor="middle" style="fill:var(--bad)">80 ms · no span</text>
  </svg>`;
      }
      // One trace as a Gantt: phone spans in chart-2, server spans in chart-1, errors in red, the time
      // nobody owns dashed. (Same function in screen.html and phone.html.)
      function traceSvg(t, { w = 900, label = 190, row = 26, max } = {}) {
        max = max || t.total || 1;
        const rank = (s) => (s.gap ? 3 : s.depth === 0 ? 0 : s.side === "phone" ? 1 : s.depth === 1 ? 2 : 3);
        const rows = [...t.spans.map((s, i) => ({ ...s, i })), ...t.gaps.map((g) => ({ ...g, gap: true, name: "no span", depth: 2 }))]
          .sort((a, b) => rank(a) - rank(b) || a.start - b.start);
        const bars = w - label - 76, x = (ms) => label + (Math.min(ms, max) / max) * bars, H = 14 + rows.length * row + 18;
        const body = rows.map((s, k) => {
          const y = 8 + k * row, wid = Math.max(2, x(s.start + s.dur) - x(s.start));
          const fill = s.gap ? "none" : s.error ? "var(--bad)" : s.side === "phone" ? "var(--c2)" : "var(--c1)";
          return `<g ${s.gap ? "" : `data-span="${s.i}"`} style="cursor:${s.gap ? "default" : "pointer"}"><text x="${4 + s.depth * 12}" y="${y + row / 2}" ${s.gap ? 'style="fill:var(--bad)"' : ""}>${esc(s.name)}</text>
            <rect x="${x(s.start)}" y="${y + 3}" width="${wid}" height="${row - 9}" rx="4" fill="${fill}" ${s.gap ? 'stroke="var(--bad)" stroke-dasharray="5 3"' : ""}/>
            <text x="${w - 4}" y="${y + row / 2}" text-anchor="end" ${s.gap ? 'style="fill:var(--bad)"' : ""}>${fmt(s.dur)}</text></g>`;
        }).join("");
        return `<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="Trace with ${t.spans.length} spans over ${fmt(t.total)}">${body}
          <line x1="${label}" x2="${label + bars}" y1="${H - 16}" y2="${H - 16}" stroke="var(--line)"/><text x="${label}" y="${H - 2}">0</text><text x="${label + bars}" y="${H - 2}" text-anchor="end">${fmt(max)}</text></svg>`;
      }
      function blend() {
        return `<table><thead><tr><th>Operation</th><th>p99</th></tr></thead><tbody>
    <tr><td><code>query Viewer</code></td><td>24 ms</td></tr><tr><td><code>query OrderDetails</code></td><td>380 ms</td></tr><tr><td><code>query InventoryReport</code></td><td>4.1 s</td></tr>
    <tr><td><b>POST /graphql (blended)</b></td><td><b>700 ms</b> <span class="muted">— describes no operation</span></td></tr></tbody></table>`;
      }
      function lineChart(points, key, max, color, label, cap) {
        // 60 one-second points
        const W = 900,
          H = 220,
          L = 50,
          B = 26,
          x = (i) => L + (i / (points.length - 1)) * (W - L - 10),
          y = (v) => H - B - (v / max) * (H - B - 10);
        const d = points
          .map((p, i) => (p[key] == null ? null : `${x(i)},${y(p[key])}`))
          .filter(Boolean);
        return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)} over the last minute">
    <line x1="${L}" x2="${W - 10}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/><text x="${L - 8}" y="${y(max) + 4}" text-anchor="end">${esc(max >= 1000 ? fmt(max) : max)}</text><text x="${L - 8}" y="${H - B + 4}" text-anchor="end">0</text>
    ${cap ? `<line x1="${L}" x2="${W - 10}" y1="${y(cap)}" y2="${y(cap)}" stroke="var(--faint)" stroke-dasharray="6 4"/><text x="${W - 10}" y="${y(cap) - 6}" text-anchor="end">capacity ${cap}/s</text>` : ""}
    ${d.length > 1 ? `<polyline points="${d.join(" ")}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    <text x="${L}" y="${H - 4}">${esc(label)} · last 60 s</text></svg>`;
      }

      // Intro and outro: one QR to the series' home, which outlives the room, and the links by name.
      const findMe = (v) =>
        `<div class="findme"><div id="qrhome" aria-hidden="true"></div><div style="display:grid;gap:6px"><span class="label">Find me</span><b>${esc(v.presenter.home.replace(/^https:\/\//, ""))}</b><span class="muted">${v.presenter.links.map((l) => esc(l.label)).join(" · ")}</span></div></div>`;
      const S = {
        chat(v, s, r) {
          if (s.breaks) {
            const o = r.outage,
              last = o.mins.slice(-5);
            return `<h1>${esc(s.title)}</h1><div class="grid2"><div>${v.broken ? `<span class="pill bad">Relay is broken</span>` : `<span class="pill good">Relay is healthy</span>`}
        <p class="lead" style="margin-top:16px">${esc(s.lead)}</p></div><div class="g"><span class="label">Last 5 minutes · failed messages</span>${last.map((m) => `<div class="row"><span>${m.total} sent</span><b>${m.errors} failed</b></div>`).join("")}</div></div>`;
          }
          return `<div class="grid2"><div style="display:grid;gap:22px"><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p><div class="url">${esc(JOIN.replace(/^https?:\/\//, ""))}</div>${CODE ? `<div class="url">Code <b>${CODE}</b></div>` : ""}</div><div class="qrbig" id="qrbig"></div></div>
      <div class="groups">${r.groups.map((g, i) => `<div class="g"><h3>${gname(g.ms, v.groupsShown, i)}</h3><div class="row"><span>Phones</span><b>${g.people}</b></div><div class="row"><span>Messages</span><b>${g.sends}</b></div></div>`).join("")}</div>`;
        },
        poll(v, s, r) {
          let body;
          if (s.reveal === "groups" && v.shown) {
            body = `<div class="groups">${r.byGroup.map((c, i) => `<div class="g"><h3>${gname(r.groupsMs?.[i] ?? [100, 1000, 3000, 7000][i], v.groupsShown, i)}</h3>${bars(s.options, c)}</div>`).join("")}</div>`;
          } else body = bars(s.options, r.counts, s.answer, v.shown);
          const visual =
            s.type === "gantt"
              ? gantt() + (v.shown && r.real ? `<span class="label">Your room's slowest message</span>${traceSvg(r.real)}` : "")
              : s.visual === "blend" ? blend() : "";
          return `<h1>${esc(s.title)}</h1>${visual ? `<div class="grid2"><div>${visual}</div><div>${body}</div></div>` : body}
      <p class="muted">${r.total} of ${v.people} answered</p>${v.shown && s.lead ? `<p class="lead">${esc(s.lead)}</p>` : ""}`;
        },
        gantt(v, s, r) {
          return S.poll(v, s, r);
        },
        fork(v, s, r) {
          // the room votes; the presenter can take any option. 🔍 = "Go deeper" taps on the scenes it deepens
          const picked = s.chosen === undefined ? -1 : s.order.indexOf(s.chosen);
          const opts = s.options.map((o, k) => `<div class="opt"><span>${esc(o)} <span class="muted">· 🔍 ${r.curious[k]}</span></span>${picked < 0 ? `<button type="button" data-choose="${s.order[k]}">Take this</button>` : k === picked ? `<span class="pill good">Chosen</span>` : ""}</div>`).join("");
          return `<span class="label">Your call · ${s.slot} minutes</span><h1>${esc(s.title)}</h1>${bars(s.options, r.counts, picked, picked >= 0)}<div class="fork">${opts}</div><p class="muted">${r.total} voted. Reveal takes the winner; Next without a vote takes the default.</p>`;
        },
        trace(v, s, r) {
          const head = `<h1>${esc(s.title)}</h1>`, id = (t) => `<span class="label">Trace ${esc(t.traceId.slice(0, 8))}… · ${fmt(t.total)}${t.ok ? "" : " · failed"}</span>`;
          if (!r.n) return `${head}<p class="lead">No traces yet — the room sends Dana a message first.</p>`;
          let body;
          if (s.mode === "mine")
            body = `<span class="label">Slowest message · same time axis</span>${traceSvg(r.slowest, { max: r.slowest.total })}<span class="label">Typical message</span>${traceSvg(r.typical, { max: r.slowest.total })}`;
          else if (s.mode === "gap")
            body = `${id(r.fastest)}${traceSvg(r.fastest)}<div class="row"><span class="muted">${r.gaps} of ${r.n} traces have time with no span</span>${v.instrumented ? `<span class="pill good">Span added: db.pool.acquire</span>` : ""}</div>`;
          else if (s.mode === "error")
            body = r.failed ? `${id(r.failed)}${traceSvg(r.failed)}` : `<p class="muted">No failed messages yet — press Break Relay (B).</p>`;
          else body = `${id(r.latest)}${traceSvg(r.latest)}`;
          return `${head}${body}<p class="muted">${r.n} messages traced this session</p><p class="lead">${esc(s.lead)}</p>`;
        },
        show(v, s) {
          return `<span class="label">${esc(v.act)}</span><h1>${esc(s.title)}</h1><p class="lead">${esc(s.lead)}</p><div class="checks">${s.items.map((i) => `<div>${esc(i)}</div>`).join("")}</div>`;
        },
        stat(v, s, r) {
          if (s.stat === "resends")
            return `<h1>${esc(s.title)}</h1><div class="groups">${r.groups.map((g, i) => `<div class="g"><h3>${gname(g.ms, v.groupsShown, i)}</h3><span class="big" style="font-size:64px">${g.sends ? Math.round((100 * g.dups) / g.sends) : 0}%</span><span class="muted">${g.dups} of ${g.sends} messages sent again</span></div>`).join("")}</div><p class="lead">${esc(s.lead)}</p>`;
          const o = r.outage,
            max = Math.max(1, ...o.mins.map((m) => m.total));
          const W = 900,
            H = 220,
            bw = (W - 60) / o.mins.length;
          const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Messages per minute, failed in red">${o.mins
            .map((m, i) => {
              const h = ((H - 40) * m.total) / max,
                he = ((H - 40) * m.errors) / max,
                x = 50 + i * bw;
              return `<rect x="${x + 2}" y="${H - 26 - h}" width="${bw - 4}" height="${h}" rx="3" fill="var(--c2)"/><rect x="${x + 2}" y="${H - 26 - he}" width="${bw - 4}" height="${he}" rx="3" fill="var(--bad)"/>`;
            })
            .join(
              "",
            )}<text x="50" y="${H - 6}">messages per minute, last 20 min · failed in red</text></svg>`;
          const target = v.slo
            ? `${v.slo.pct}% within ${fmt(v.slo.ms)}`
            : "99.9% within 1 s (today's default)";
          return `<h1>${esc(s.title)}</h1><div class="grid2"><div>${svg}</div><div style="display:grid;gap:14px"><span class="label">Uptime this session</span><span class="big">${o.uptime == null ? "—" : (100 * o.uptime).toFixed(2) + "%"}</span><span class="muted">The room's target: ${esc(target)}</span></div></div><p class="lead">${esc(s.lead)}</p>`;
        },
        journey(v, s, r) {
          const max = Math.max(1, ...r.groups.map((g) => g.rtt || 0));
          return `<h1>${esc(s.title)}</h1><svg viewBox="0 0 900 90" role="img" aria-label="Request path: phone, network, gateway, queue, Relay, database">
      ${["Phone", "Network", "Gateway", "Queue", "Relay", "Database"].map((n, i) => `<rect x="${i * 150}" y="20" width="130" height="44" rx="10" fill="${n === "Relay" ? "var(--primary-subtle)" : "var(--quiet)"}" stroke="${n === "Relay" ? "var(--c1)" : "var(--line)"}"/><text x="${i * 150 + 65}" y="47" text-anchor="middle" style="fill:var(--fg)">${n}</text>${i < 5 ? `<text x="${i * 150 + 140}" y="47" text-anchor="middle">→</text>` : ""}`).join("")}
      <text x="600" y="84" text-anchor="middle" style="fill:var(--c1)">service time is only this part</text></svg>
      <div class="groups">${r.groups.map((g, i) => `<div class="g"><h3>${gname(g.ms, v.groupsShown, i)}</h3><div class="row"><span>Waited</span><b>${fmt(g.rtt)}</b></div><div class="row"><span>Inside Relay</span><b>${fmt(g.service)}</b></div><div class="row"><span>Everything else</span><b>${g.rtt == null ? "—" : fmt(g.rtt - g.service)}</b></div></div>`).join("")}</div><p class="lead">${esc(s.lead)}</p>`;
        },
        dots(v, s, r) {
          if (!r.dots.length)
            return `<h1>${esc(s.title)}</h1><p class="lead">No messages yet.</p>`;
          const W = 900,
            H = 320,
            L = 110,
            lo = Math.log10(30),
            hi = Math.log10(Math.max(10000, r.max * 1.2));
          const x = (ms) =>
            L +
            ((Math.log10(Math.max(30, ms)) - lo) / (hi - lo)) * (W - L - 20);
          const rowY = (g) => 40 + [100, 1000, 3000, 7000].indexOf(g) * 44;
          const marks = [
            ["mean", r.mean, "var(--faint)"],
            ["p50", r.p50, "var(--fg)"],
            ["p95", r.p95, "var(--fg)"],
            ["p99", r.p99, "var(--c1)"],
            ["max", r.max, "var(--bad)"],
          ];
          return `<h1>${esc(s.title)}</h1><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Every message's response time, with mean, p50, p95, p99 and max">
      ${[100, 1000, 3000, 7000].map((g, i) => `<text x="0" y="${rowY(g) + 4}">${gname(g, v.groupsShown, i)}</text><line x1="${L}" x2="${W - 20}" y1="${rowY(g)}" y2="${rowY(g)}" stroke="var(--line)"/>`).join("")}
      ${r.dots.map((d, i) => `<circle cx="${x(d.ms)}" cy="${rowY(d.g) + (((i * 37) % 17) - 8)}" r="5" fill="var(--c2)" fill-opacity=".7"/>`).join("")}
      ${marks.map(([n, ms, c], k) => `<line x1="${x(ms)}" x2="${x(ms)}" y1="20" y2="${H - 96}" stroke="${c}" stroke-width="2" stroke-dasharray="${n === "mean" ? "3 4" : ""}"/><text x="${x(ms) + 4}" y="${H - 86 + k * 15}" style="fill:${c}">${n} ${fmt(ms)}</text>`).join("")}
      ${[100, 1000, 10000].map((t) => `<text x="${x(t)}" y="${H - 4}" text-anchor="middle">${fmt(t)}</text>`).join("")}
    </svg><p class="lead">${esc(s.lead)}</p>`;
        },
        metrics(v, s, r) {
          const spark = (xs, key, color) => {
            const max = Math.max(1, ...xs.map((x) => x[key]));
            return `<svg viewBox="0 0 300 70" class="spark" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="3" points="${xs.map((x, i) => `${(i * 300) / (xs.length - 1)},${66 - (x[key] / max) * 60}`).join(" ")}"/></svg>`;
          };
          const per = r.buckets.map((c, i) => c - (i ? r.buckets[i - 1] : 0)), top = Math.max(1, ...per);
          const labels = ["≤0.25 s", "≤0.5 s", "≤1 s", "≤2.5 s", "≤5 s", "≤10 s"];
          return `<h1>${esc(s.title)}</h1><div class="metrics3">
      <div class="g"><span class="label">Counter · relay_messages_total</span><span class="big">${r.total}</span><span class="muted">${r.rate.toFixed(1)} msg/s now · ${r.errors} failed</span>${spark(r.secs, "sent", "var(--c1)")}</div>
      <div class="g"><span class="label">Gauge · phones sending now</span><span class="big">${r.sending}</span><span class="muted">goes up and down</span>${spark(r.secs, "phones", "var(--c2)")}</div>
      <div class="g"><span class="label">Histogram · relay_send_duration_seconds</span>
        <svg viewBox="0 0 300 150" aria-label="Messages per latency bucket">${per.map((c, i) => `<rect x="${i * 50 + 4}" y="${120 - (c / top) * 100}" width="42" height="${(c / top) * 100}" rx="4" fill="var(--c2)"/><text x="${i * 50 + 25}" y="140" text-anchor="middle" style="font-size:11px">${labels[i]}</text><text x="${i * 50 + 25}" y="${114 - (c / top) * 100}" text-anchor="middle" style="font-size:12px;fill:var(--fg)">${c}</text>`).join("")}</svg>
        <div class="row"><span>p95, exact</span><b>${fmt(r.p95)}</b></div><div class="row"><span>p95 from the buckets</span><b>${fmt(r.p95FromBuckets)}</b></div><div class="row"><span>mean</span><b>${fmt(r.mean)}</b></div></div></div>
      ${v.shown ? `<p class="lead">${esc(s.lead)}</p>` : ""}`;
        },
        logs(v, s, r) {
          const row = (l) => `<code class="logline ${l.level}">${esc(JSON.stringify(l))}</code>`;
          return `<h1>${esc(s.title)}</h1><div class="grid2"><div class="logs">${r.lines.length ? r.lines.map(row).join("") : `<p class="lead">No messages yet.</p>`}</div>
      <div style="display:grid;gap:14px;align-content:start"><div class="g"><span class="label">Lines</span><span class="big">${r.count}</span><span class="muted">${r.errors} errors</span></div>
      ${v.shown && r.slowest ? `<div class="g"><span class="label">The room's slowest message</span><span class="big">${fmt(r.slowest.duration_ms)}</span><span class="muted">client ${esc(r.slowest.client)} · trace ${esc((r.slowest.trace_id || "").slice(0, 12))}…</span></div>` : `<div class="g"><span class="label">Find the slowest by scrolling</span><span class="muted">Press R to reveal it.</span></div>`}
      <div class="g"><span class="label">Where this line went</span><span class="muted">stdout → shipper (Fluent Bit · Filebeat · CloudWatch agent · OTel Collector) → CloudWatch · Kibana · Loki</span></div></div></div>
      ${v.shown ? `<p class="lead">${esc(s.lead)}</p>` : ""}`;
        },
        fanout(v, s, r) {
          return `<h1>${esc(s.title)}</h1><div class="grid2"><div style="display:grid;gap:10px"><span class="label">Jobs the room ran that were slow</span><span class="big">${r.share == null ? "—" : Math.round(100 * r.share) + "%"}</span><span class="muted">${r.slow} of ${r.n} jobs · only 1% of calls are slow</span></div>
      <div class="g"><span class="label">The math</span><span style="font-size:30px;font-weight:700">1 − 0.99<sup>100</sup> = 63%</span><span class="muted">10 calls → 9.6% · 100 calls → 63%</span></div></div>${v.shown ? `<p class="lead">${esc(s.lead)}</p>` : ""}`;
        },
        requests(v, s, r) {
          const cells = [...Array(100)]
            .map((_, i) =>
              r.last[i] === undefined
                ? "<i></i>"
                : `<i class="${r.last[i] ? "ok" : "err"}"></i>`,
            )
            .join("");
          return `<h1>${esc(s.title)}</h1><div class="grid2"><div class="cells" aria-label="Last 100 requests">${cells}</div><div style="display:grid;gap:10px"><span class="label">Uptime · ${r.ok} of ${r.total} requests worked</span><span class="big">${r.uptime == null ? "—" : (100 * r.uptime).toFixed(1) + "%"}</span>${v.broken ? `<span class="pill bad">Relay is broken</span>` : ""}</div></div><p class="lead">${esc(s.lead)}</p>`;
        },
        nines(v, s, r) {
          return `<h1>${esc(s.title)}</h1><div class="grid2"><table><thead><tr><th>Target</th><th>Per year</th><th>Per month</th><th>Per day</th><th>Room</th></tr></thead><tbody>${NINES_ROWS.map((row, i) => `<tr><td><b>${row[0]}%</b></td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td><b>${r.counts[i]}</b></td></tr>`).join("")}</tbody></table><p class="lead">${esc(s.lead)}</p></div>`;
        },
        slo(v, s, r) {
          return `<h1>${esc(s.title)}</h1>${v.slo ? `<p class="big" style="font-size:clamp(36px,4.4vw,64px)">"${v.slo.pct}% of messages delivered within ${fmt(v.slo.ms)}, over 28 days."</p>` : `<p class="lead">${r.total} phones have picked. Reveal to lock the room's choice.</p>`}<p class="muted">${esc(s.notes)}</p>`;
        },
        load(v, s, r) {
          return `<h1>${esc(s.title)}</h1><div class="grid2"><div style="display:grid;gap:10px">${lineChart(r.secs, "rate", Math.max(120, ...r.secs.map((p) => p.rate)), "var(--c2)", "requests per second", r.capacity)}${lineChart(r.secs, "p99", Math.max(1000, ...r.secs.map((p) => p.p99 || 0)), "var(--c1)", "p99 response time")}</div>
      <div style="display:grid;gap:14px"><div class="row"><span class="label">Rate</span><b>${r.rate.toFixed(0)} / s</b></div><div class="row"><span class="label">p99</span><b>${fmt(r.p99)}</b></div>
      <div class="g"><span class="label">Little's Law</span><b>in flight = rate × latency</b><span class="muted">${r.rate.toFixed(0)}/s × ${fmt(r.p50)} ≈ ${r.p50 == null ? "—" : Math.round((r.rate * r.p50) / 1000)}</span></div></div></div><p class="lead">${esc(s.lead)}</p>`;
        },
        intro(v, s) {
          const who = v.speaker; // the version for this audience, picked in the console
          const head = v.intro === "returning"
            ? `<h1 style="font-size:clamp(44px,5.6vw,88px)">Welcome back</h1><p class="lead">${esc(v.presenter.name)}</p>`
            : `<h1 style="font-size:clamp(44px,5.6vw,88px)">${esc(s.title)}</h1><p class="lead">${esc(who.lead)}</p><div class="checks intro">${who.items.map((i) => `<div>${esc(i)}</div>`).join("")}</div>`;
          return `<div class="grid2" style="align-items:center"><div style="display:grid;gap:18px"><img src="${esc(v.presenter.photo)}" alt="${esc(v.presenter.name)}" width="180" height="180" style="width:clamp(140px,12vw,220px);height:auto;border-radius:50%" />${head}</div>
      <div style="display:grid;justify-items:start">${findMe(v)}</div></div>`;
        },
        why(v) {
          const w = v.why;
          return `<span class="label">Why this matters</span><h1 style="font-size:clamp(48px,6vw,96px)">${esc(w.title)}</h1><p class="lead">${esc(w.lead)}</p><p class="case"><span class="label">Case</span> <b>${esc(w.case.who)}</b> · ${esc(w.case.what)}</p>`;
        },
        cases(v, s, r) {
          if (!v.study) {
            const top = Math.max(1, ...r.counts);
            return `<span class="label">Business use cases · you choose</span><h1>${esc(s.title)}</h1>
      <div class="cards">${(v.cards || []).map((c, i) => `<div class="card-case ${r.counts[i] === top && r.total ? "lead" : ""}"><b>${esc(c.who)}</b><span>${esc(c.what)}</span><div class="votes"><i style="width:${Math.round((100 * r.counts[i]) / top)}%"></i><em>${r.counts[i]}</em></div></div>`).join("")}</div>
      <p class="muted">${r.total} of ${v.people} chose · R ends the vote, the majority wins</p>`;
          }
          const c = v.study;
          return `<span class="label">Case study · the room picked</span><h1>${esc(c.who)}</h1><div class="checks">
      <div class="row"><span class="label">What happened</span><span>${esc(c.happened || c.what)}</span></div>
      ${c.why ? `<div class="row"><span class="label">Why</span><span>${esc(c.why)}</span></div>` : ""}
      ${c.lesson ? `<div class="row"><span class="label">The lesson</span><b>${esc(c.lesson)}</b></div>` : ""}</div>
      <p class="muted">Source: ${esc(new URL(c.source).hostname)}</p>`;
        },
        outro(v) {
          return `<div class="grid2"><div style="display:grid;gap:18px;align-content:start"><span class="label">Next · ${esc(v.next.track)}</span><h1 style="font-size:clamp(44px,5.6vw,88px)">${esc(v.next.what)}</h1>
      <div class="series">${v.series.map((x) => `<div class="g ${x.status === "Today" ? "on" : ""}"><span class="label">${esc(x.track)} · ${esc(x.status)}</span><span>${esc(x.what)}</span></div>`).join("")}</div></div>
      <div style="display:grid;gap:14px;align-content:start"><div class="g"><span class="label">Follow · track · review</span><span style="font-size:clamp(24px,2.2vw,34px);font-weight:600">Scan: the series, your recap, my links</span></div>${findMe(v)}</div></div>`;
        },
        today(v) {
          const t = v.today;
          return `<div class="focus"><span class="label">What we'll cover</span><h1>${esc(v.workshop)}</h1><p class="tag">${esc(v.promise)}</p>
      <div class="cover3">
        <section><span class="label">Concepts</span><ol class="clean">${t.parts.map((x) => `<li>${esc(x.concept)}</li>`).join("")}</ol></section>
        <section><span class="label">Terms</span><div class="chips">${t.terms.map((x) => `<span>${esc(x.term)}</span>`).join("")}</div></section>
        <section><span class="label">By the end, you'll answer</span><ul class="clean asks">${t.parts.map((x) => `<li>${esc(x.asks)}</li>`).join("")}</ul></section>
      </div></div>`;
        },
        next(v, s) {
          return `<span class="label">Coming up</span><h1>${esc(s.title)}</h1><div class="checks next">${s.items.map((i) => `<div>${esc(i)}</div>`).join("")}</div>`;
        },
        qa(v, s) {
          const L = v.learning || [];
          const learned = L.length ? `<div class="g"><span class="label">How the room learned · % right, in order</span>${L.map((x) => `<div class="row"><span>${esc(x.a)}</span><b>${x.total ? Math.round((100 * x.right) / x.total) + "%" : "—"}</b></div>`).join("")}</div>` : "";
          return `<div class="grid2"><div style="display:grid;gap:18px;align-content:start"><span class="label">${esc(v.workshop)}</span><h1 style="font-size:clamp(56px,7vw,110px)">${esc(s.title)}</h1>${findMe(v)}</div>${learned}</div>`;
        },
        waiting(v, s) {
          const w = v.waiting;
          return `<div class="welcome"><div style="display:grid;gap:22px">
        <div class="who"><img src="${esc(v.presenter.photo)}" alt="${esc(v.presenter.name)}" /><div><span class="label">Your host</span><b>${esc(v.presenter.name)}</b><span class="muted">${esc(w.lead)}</span></div></div>
        <div><span class="label">Workshop · ${w.minutes} min · on your phone</span><h1>${esc(s.title)}</h1><p class="tag">${esc(v.promise)}</p></div>
        <div class="g"><span class="label">What we'll do</span><ol>${w.parts.map((p) => `<li><span><b>${esc(p.name)}</b> · ${esc(p.q)}</span></li>`).join("")}</ol></div></div>
      <div class="joinbox"><span class="label">Scan to join</span><div class="qrbig" id="qrbig"></div><div class="url">${esc(JOIN.replace(/^https?:\/\//, ""))}</div>${CODE ? `<div class="url">Code <b>${CODE}</b></div>` : ""}
        <span class="here" data-testid="waiting-people"><span id="herecount">${v.people}</span> here · starting soon</span></div></div>`;
        },
        takeaway(v, s, r) {
          return `<h1>${esc(s.title)}</h1><div class="checks">${s.items.map((i, k) => `<div class="row"><span>${esc(i)}</span><b>${r.counts[k]}</b></div>`).join("")}</div><p class="lead">${r.total} picked one to do this week. In a week, their phones ask: did you?</p>`;
        },
      };

      let lastKey = "", lastPeople = 0, deepLinked = false;
      const bumpEl = (el) => { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); };
      // Hide the controls when the mouse rests; any movement or a focused control brings them back.
      let idleTimer;
      const wake = () => { document.body.classList.remove("idle"); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!document.querySelector(".bottom:focus-within")) document.body.classList.add("idle"); }, 3000); };
      addEventListener("mousemove", wake);
      addEventListener("focusin", wake);
      wake();
      function render(v) {
        const s = v.scene;
        setTimer(v.timer);
        $("where").textContent =
          `${v.workshop} · ${v.act} · ${v.i + 1}/${v.n}`;
        if (v.people > lastPeople) bumpEl($("people"));
        lastPeople = v.people;
        $("people").textContent = v.people;
        $("deeper").textContent = v.curious;
        $("clock").textContent =
          `${s.min} min · ${v.workshopId === 5 ? "Signals" : "workshop " + v.workshopId} ends this scene at ${v.clock}:00 / ${v.total}:00` +
          (v.over ? ` · ${v.over} min over — skip: ${v.flexAhead.join(", ") || "shorten questions"}` : "");
        $("notes").textContent =
          (s.type === "intro" ? v.speaker.notes + " " : "") + (s.notes || "") + (s.case ? " Case: " + s.case.tell.replace(/^Say: /, "") : "");
        const aud = $("aud");
        if (!aud.options.length)
          aud.innerHTML = v.audiences.map((x) => `<option value="${esc(x.k)}">${esc(x.label)}</option>`).join("");
        if (document.activeElement !== aud) aud.value = v.audience;
        const lib = $("lib");
        if (!lib.options.length) {
          const acts = [...new Set(v.library.map((x) => x.act))];
          lib.innerHTML = `<option value="">Play a scene…</option>` + acts.map((a) => `<optgroup label="${esc(a)}">${v.library.filter((x) => x.act === a).map((x) => `<option value="${esc(x.id)}">${esc(x.title)} · ${x.min} min</option>`).join("")}</optgroup>`).join("");
        }
        const key = `${v.begun}:${s.id}:${v.shown}:${v.study ? v.study.who : ""}`, changed = key !== lastKey;
        lastKey = key;
        $("stage").classList.toggle("enter", changed);
        // Deep link: the address names the step (#mean); opening it jumps the room there once.
        if (!deepLinked) {
          deepLinked = true;
          const want = decodeURIComponent(location.hash.slice(1)), k = v.path.indexOf(want);
          if (want && k >= 0 && k !== v.i) return control("goto", { i: k });
        }
        if (v.begun && v.path[v.i] && location.hash.slice(1) !== v.path[v.i]) history.replaceState(null, "", "#" + v.path[v.i]);
        $("stage").innerHTML = (
          S[s.type] || ((_, x) => `<h1>${esc(x.title)}</h1>`)
        )(v, s, v.results) + (s.case ? `<p class="case" data-testid="case"><span class="label">${s.case.source ? "Case" : "Example"}</span> <b>${esc(s.case.who.replace(/^Example: /, ""))}</b> · ${esc(s.case.what)}</p>` : "") + (v.remember ? `<p class="remember" data-testid="remember"><span class="label">Remember</span> ${esc(v.remember)}</p>` : "");
        const big = $("qrbig");
        if (big) qr(big, 240);
        const home = $("qrhome");
        if (home) qr(home, 132, v.presenter.home);
      }

      const control = (op, extra = {}) =>
        fetch("/api/control?t=" + encodeURIComponent(T), {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ op, ...extra }),
        });
      document.querySelectorAll("[data-start]").forEach((b) => {
        let armedStart = false; // switching workshops empties the room: tap twice
        b.onclick = () => {
          if (!armedStart) {
            armedStart = true;
            const label = b.textContent;
            b.textContent = "Tap again: empties the room";
            setTimeout(() => { armedStart = false; b.textContent = label; }, 3000);
            return;
          }
          control("start", { w: +b.dataset.start });
        };
      });
      $("aud").onchange = (e) => control("audience", { a: e.target.value });
      $("lib").onchange = (e) => {
        if (e.target.value) control("detour", { id: e.target.value }); // plays now, then back to the spine
        e.target.value = "";
      };
      $("stage").addEventListener("click", (e) => {
        const b = e.target.closest("[data-choose]");
        if (b) control("choose", { i: +b.dataset.choose });
      });
      document
        .querySelectorAll("[data-op]")
        .forEach((b) => (b.onclick = () => control(b.dataset.op)));
      function toggleNotes() {
        const n = $("notes");
        n.hidden = !n.hidden;
        $("notesBtn").setAttribute("aria-pressed", String(!n.hidden));
      }
      $("notesBtn").onclick = toggleNotes;
      let armed = false;
      $("reset").onclick = (e) => {
        if (!armed) {
          armed = true;
          e.target.textContent = "Tap again to reset";
          setTimeout(() => {
            armed = false;
            e.target.textContent = "Reset room";
          }, 3000);
          return;
        }
        armed = false;
        e.target.textContent = "Reset room";
        control("reset");
      };
      const keys = $("keys");
      const toggleKeys = () => (keys.open ? keys.close() : keys.showModal());
      $("keysBtn").onclick = toggleKeys;
      keys.onclick = (e) => { if (e.target === keys) keys.close(); }; // a click outside the card closes it
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (e.key === "?" || ((e.metaKey || e.ctrlKey) && e.key === "/")) { e.preventDefault(); return toggleKeys(); }
        if (keys.open) return;
        if (e.key === "ArrowRight" || e.key === "PageDown") control("next");
        else if (e.key === "ArrowLeft" || e.key === "PageUp") control("prev");
        else if (k === "r") control("reveal");
        else if (k === "g") control("groups");
        else if (k === "b") control("break");
        else if (k === "f") control("fix");
        else if (k === "a") control("instrument");
        else if (k === "n") toggleNotes();
      });
      (async function poll() {
        try {
          const r = await fetch("/api/screen?t=" + encodeURIComponent(T), { cache: "no-store" });
          if (r.ok) render(await r.json());
        } catch {}
        setTimeout(poll, 1000);
      })();
    
      // The countdown: the server says how much is left; this page counts down from when it heard it.
      let deadline = null;
      function setTimer(t) { deadline = t ? { at: Date.now() + t.left, total: t.total } : null; tick(); }
      function tick() {
        const el = document.getElementById("timer");
        if (!el) return;
        if (!deadline) { el.hidden = true; return; }
        const left = Math.max(0, deadline.at - Date.now()), sec = Math.ceil(left / 1000);
        el.hidden = false;
        el.textContent = left ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}` : "Time";
        el.classList.toggle("low", left > 0 && left <= 30_000);
        el.classList.toggle("done", left === 0);
      }
      setInterval(tick, 1000);
</script>
    </body>
</html>
