<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Workshop recap</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Where the QR lands: one column of big links, read in a second. Same tokens as the phone. */
      :root {
        --bg: #faf7f4;
        --card: #fff;
        --fg: #0d0b09;
        --muted: #4d453c;
        --line: #eae7e2;
        --primary: #7d350c;
        --primary-fg: #fff;
        --mark-o: #a84c17;
        --mark-g: #0a6b47;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171412;
          --fg: #f0ede9;
          --muted: #c9c3bb;
          --line: #252019;
          --primary: #fbb99a;
          --primary-fg: #0a0a0a;
          --mark-o: #f4794a;
          --mark-g: #0d9460;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--sans); }
      main {
        display: grid;
        gap: 28px;
        justify-items: center;
        max-width: 480px;
        margin: 0 auto;
        padding-block: max(48px, env(safe-area-inset-top)) 48px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        text-align: center;
      }
      .mark { width: 72px; height: 72px; }
      h1 { font-size: 30px; line-height: 1.1; margin: 8px 0 4px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      nav { display: grid; gap: 12px; width: 100%; }
      nav a {
        display: grid;
        place-items: center;
        min-height: 56px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        font-weight: 600;
        text-decoration: none;
      }
      nav a:first-child { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      nav a:hover, nav a:focus-visible { border-color: var(--primary); }
      section { display: grid; gap: 6px; width: 100%; border-top: 1px solid var(--line); }
      .label { font: 600 12px/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-top: 20px; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      li { color: var(--muted); font-size: 15px; }
      li b { color: var(--fg); font-weight: 600; }
      footer { font-size: 14px; }
      footer a { color: var(--primary); }
    </style>
    <style>
      main { justify-items: stretch; text-align: left; }
      h1, header p { text-align: center; }
      .card { display: grid; gap: 6px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
      .row { display: flex; justify-content: space-between; gap: 12px; }
      .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
      dt { font-weight: 600; color: var(--fg); } dd { margin: 0 0 8px; color: var(--muted); }
      .actions { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      button { min-height: 56px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 600 17px var(--sans); }
      button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-30 50 50)"><rect x="10" y="18" width="62" height="28" rx="14" fill="var(--mark-o)" /><rect x="28" y="54" width="62" height="28" rx="14" fill="var(--mark-g)" /></g></svg><h1 id="title">Your recap</h1><p id="promise"></p></header>
      <p id="msg" role="status"></p>
      <div id="out"></div>
      <footer><a href="/">Ofri Peretz · all workshops and links</a></footer>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const ms = (x) => (x == null ? "—" : x < 1000 ? Math.round(x) + " ms" : (x / 1000).toFixed(1) + " s");
      const Q = new URLSearchParams(location.search);
      const signed = Q.get("p") && Q.get("k") ? `&p=${encodeURIComponent(Q.get("p"))}&k=${encodeURIComponent(Q.get("k"))}` : "";
      (async () => {
        const r = await fetch(`/api/recap?r=${encodeURIComponent(Q.get("r") || "")}${signed}`).catch(() => null);
        if (!r || !r.ok) { $("msg").textContent = "This recap isn't available. Check the link from your phone."; return; }
        const v = await r.json();
        $("title").textContent = v.title; $("promise").textContent = v.promise; document.title = v.title + " · recap";
        const mine = v.mine ? `<section class="card" data-testid="recap-mine"><span class="label">You</span><div class="row"><span>Messages you sent</span><b>${v.mine.sent}</b></div><div class="row"><span>Your p95</span><b>${ms(v.mine.p95)}</b></div>${v.mine.score.answered ? `<div class="row"><span>Questions you got right</span><b>${v.mine.score.right} of ${v.mine.score.answered}</b></div>` : ""}${v.mine.pick ? `<p>Your one thing this week: <b>${esc(v.mine.pick)}</b></p>` : ""}</section>` : "";
        $("out").innerHTML = `<div style="display:grid;gap:16px">${mine}
          <section class="card"><span class="label">The room</span><div class="row"><span>People</span><b>${v.room.people}</b></div><div class="row"><span>Messages</span><b>${v.room.messages}</b></div><div class="row"><span>The room's p95</span><b>${ms(v.room.p95)}</b></div></section>
          ${v.learning.length ? `<section class="card"><span class="label">How the room learned · % right</span>${v.learning.map((x) => `<div class="row"><span>${esc(x.a)}</span><b>${x.total ? Math.round((100 * x.right) / x.total) + "%" : "—"}</b></div>`).join("")}</section>` : ""}
          <section class="card"><span class="label">What we covered</span>${v.parts.map((p) => `<p><b>${esc(p.name)}</b> · ${esc(p.q)}<br>${esc(p.remember)}</p>`).join("")}</section>
          ${v.monday ? `<section class="card"><span class="label">What the room will do this week</span>${v.monday.items.map((it, i) => `<div class="row"><span>${esc(it)}</span><b>${v.monday.counts[i]}</b></div>`).join("")}</section>` : ""}
          <section class="card"><span class="label">Terms</span><dl>${v.terms.map((t) => `<dt>${esc(t.term)}</dt><dd>${esc(t.def)}</dd>`).join("")}</dl></section>
          ${v.cases.length ? `<section class="card"><span class="label">Real cases</span>${v.cases.map((c) => `<p><a href="${esc(c.source)}" rel="noopener">${esc(c.who)}</a> · ${esc(c.what)}</p>`).join("")}</section>` : ""}</div>`;
      })();
    </script>
  </body>
</html>
