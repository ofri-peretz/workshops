<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Workshop</title>
    <style>
      /* Phone: the audience's controls. Interlace chrome; the chat itself looks like a phone's messages app. */
      :root {
        --bg: #faf7f4;
        --card: #fff;
        --fg: #0d0b09;
        --muted: #4d453c;
        --line: #eae7e2;
        --quiet: #f5f3f0;
        --primary: #7d350c;
        --primary-fg: #fff;
        --primary-subtle: #fef4ed;
        --strand: oklch(0.55 0.16 41);
        --good: #065f46;
        --bad: #991b1b;
        --good-bg: #ffffff; /* kit card: status colour stays on the text */
        --bad-bg: #ffffff;
        --in: #f5f3f0;
        --in-fg: #0d0b09;
        --screen: #fff;
        --c1: oklch(0.55 0.16 41); /* kit chart-1: server spans */
        --c2: oklch(0.55 0.14 162); /* kit chart-2: phone spans */
        --mark-o: #a84c17; /* the Interlace mark: orange leads, green follows */
        --mark-g: #0a6b47;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI",
          Roboto, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171412;
          --fg: #f0ede9;
          --muted: #c9c3bb;
          --line: #252019;
          --quiet: #201c17;
          --primary: #fbb99a;
          --primary-fg: #0a0a0a;
          --primary-subtle: #3d1a08;
          --strand: oklch(0.78 0.14 41);
          --good: #34d399;
          --bad: #fca5a5;
          --good-bg: #171412;
          --bad-bg: #171412;
          --in: #201c17;
          --in-fg: #f0ede9;
          --screen: #0a0a0a;
          --c1: oklch(0.78 0.14 41);
          --c2: oklch(0.78 0.12 162);
          --mark-o: #f4794a;
          --mark-g: #0d9460;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      .onepage { display: grid; gap: 20px; }
      .onepage .label { display: block; margin-bottom: 6px; }
      .onepage .col { display: contents; } /* phone: one column, in reading order */
      .onepage h1 { font-size: 40px; line-height: 1.05; margin: 4px 0; }
      .onepage .tag { font-size: 20px; color: var(--fg); margin: 0; }
      .onepage .meta { color: var(--muted); margin: 0; }
      .onepage ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: p; }
      .onepage ol li { counter-increment: p; display: grid; grid-template-columns: 28px 1fr; gap: 2px 8px; }
      .onepage ol li::before { content: counter(p); grid-row: span 2; font-weight: 700; color: var(--primary, var(--fg)); }
      .onepage ol li span { color: var(--muted); }
      .host { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
      .host .avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
      .host ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
      .share { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
      .share .qr { background: #fff; padding: 8px; border-radius: 12px; width: 132px; height: 132px; }
      .share .qr img, .share .qr canvas { width: 116px !important; height: 116px !important; }
      @media (min-width: 900px) {
        .onepage { grid-template-columns: 1.2fr 1fr; align-items: start; column-gap: 32px; }
        .onepage > .hero { grid-column: 1 / -1; }
        .onepage .col { display: grid; gap: 20px; align-content: start; }
        .onepage h1 { font-size: clamp(48px, 6vw, 96px); }
        .onepage .tag { font-size: clamp(22px, 2.2vw, 36px); }
        .onepage { font-size: clamp(16px, 1.2vw, 22px); }
        .share .qr { width: clamp(132px, 14vw, 240px); height: clamp(132px, 14vw, 240px); }
        .share .qr img, .share .qr canvas { width: 100% !important; height: 100% !important; }
      }
      .timer { font: 700 16px/1 var(--mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); margin-left: auto; }
      .timer.low { border-color: var(--primary, currentColor); }
      header { position: relative; }
      .progress { position: absolute; left: 0; right: 0; bottom: -2px; height: 3px; background: transparent; } .progress i { display: block; height: 100%; width: 0; background: var(--primary, currentColor); transition: width 400ms ease; }
      .score { font: 700 15px/1 var(--mono); padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
      .locked { font-weight: 600; }
      .casecard { display: grid; gap: 4px; text-align: left; padding: 16px; }
      .casecard span { color: var(--muted); font-weight: 400; }
      @media (prefers-reduced-motion: reduce) { .progress i { transition: none; } }
      .steps { list-style: none; margin: 0; display: grid; gap: 12px; counter-reset: s; }
      .steps li { counter-increment: s; display: grid; grid-template-columns: 24px 1fr; gap: 2px 8px; }
      .steps li::before { grid-row: span 3; }
      .steps li::before { content: counter(s); grid-row: span 2; font-weight: 700; color: var(--primary, var(--fg)); }
      .steps li span { color: var(--muted); font-size: 14px; }
      .steps li .hook { font-size: 16px; grid-column: 2; }
      .steps li .chips { grid-column: 2; margin-top: 4px; }
      .ico { width: 20px; height: 20px; flex: none; }
      .findme {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .findme a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--fg);
        font-weight: 600;
        text-decoration: none;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.4 var(--sans);
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
        border-bottom: 2px solid var(--strand);
        background: var(--card);
      }
      header .brandrow {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      header .mark {
        width: 24px;
        height: 24px;
      }
      header button.tbtn {
        width: auto;
        font: 600 13px var(--sans);
        padding: 6px 10px;
        border-radius: 99px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
      #terms dl {
        margin: 0;
        display: grid;
        gap: 10px;
      }
      #terms dt {
        font-weight: 700;
      }
      #terms dd {
        margin: 2px 0 0;
        color: var(--muted);
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
      }
      svg text {
        font: 11px var(--mono);
        fill: var(--muted);
      }
      button.deeper {
        text-align: center;
        font-size: 15px;
        padding: 10px;
        color: var(--primary);
        border-color: var(--primary);
      }
      header b {
        font-weight: 800;
        letter-spacing: -0.02em;
        font-size: 18px;
      }
      header span {
        font: 500 11px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      main {
        width: 100%;
        max-width: 1200px; /* mobile first; on a laptop or TV the page stays readable, not stretched */
        margin-inline: auto;
        overflow-y: auto;
        padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
        display: grid;
        align-content: start;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        display: grid;
        gap: 10px;
      }
      .lead {
        border-left: 3px solid var(--strand);
        padding-left: 12px;
        color: var(--fg);
      }
      .big {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
      }
      #gateForm { display: grid; gap: 10px; margin-top: 12px; }
      .logs { display: grid; gap: 6px; overflow-x: auto; }
      .logline { display: block; font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; padding: 6px 8px; border-radius: 8px; background: var(--bg); }
      .logline.warn { box-shadow: inset 3px 0 0 var(--c1); }
      .logline.error { box-shadow: inset 3px 0 0 var(--bad); }
      .logline.slow { outline: 2px solid var(--c1); }
      #code { font: 600 28px/1.2 var(--mono); letter-spacing: 0.3em; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; box-sizing: border-box; }
      .label {
        font: 500 11px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      button {
        font: 600 16px var(--sans);
        border-radius: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--fg);
        text-align: left;
        width: 100%;
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-fg);
        text-align: center;
        font-size: 18px;
        padding: 18px;
      }
      button[aria-pressed="true"] {
        border-color: var(--primary);
        background: var(--primary-subtle);
      }
      button.right {
        border-color: var(--good);
        background: var(--good-bg);
      }
      button.wrong {
        opacity: 0.55;
      }
      button:disabled {
        opacity: 0.55;
      }
      button:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 2px;
      }
      .opts {
        display: grid;
        gap: 8px;
      }
      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chips button {
        width: auto;
        text-align: center;
        padding: 10px 14px;
      }
      .ok {
        color: var(--good);
      }
      .err {
        color: var(--bad);
      }
      .split {
        display: flex;
        height: 18px;
        border-radius: 99px;
        overflow: hidden;
        background: var(--quiet);
      }
      .split i {
        display: block;
        height: 100%;
      }
      .split .s {
        background: var(--strand);
      }
      .split .n {
        background: var(--muted);
        opacity: 0.35;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      a.btn {
        display: block;
        text-align: center;
        font-weight: 600;
        padding: 14px;
        border-radius: 12px;
        background: var(--primary);
        color: var(--primary-fg);
        text-decoration: none;
      }
      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-weight: 600;
      }
      .switch input {
        width: 54px;
        height: 32px;
        accent-color: var(--primary);
      }
      .check {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .check input {
        width: 22px;
        height: 22px;
        margin-top: 1px;
        accent-color: var(--primary);
        flex: none;
      }
      /* chat */
      #chat {
        display: none;
        grid-template-rows: auto 1fr auto;
        background: var(--screen);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        height: min(62vh, 520px);
      }
      #chat.on {
        display: grid;
      }
      .ctop {
        display: grid;
        justify-items: center;
        gap: 2px;
        padding: 10px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--primary-subtle);
        color: var(--primary);
        display: grid;
        place-items: center;
        font-weight: 600;
      }
      .ctop small {
        font-size: 12px;
        color: var(--muted);
      }
      #msgs {
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      #msgs .spacer {
        flex: 1;
      }
      .msg {
        max-width: 78%;
        padding: 8px 13px;
        border-radius: 19px;
        overflow-wrap: anywhere;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }
      .in {
        background: var(--in);
        color: var(--in-fg);
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }
      .out {
        background: var(--primary);
        color: var(--primary-fg);
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }
      .out.pending {
        opacity: 0.55;
      }
      .out.again {
        box-shadow:
          0 0 0 2px var(--screen),
          0 0 0 4px var(--bad);
      }
      .out.failed {
        background: var(--bad);
      }
      .receipt {
        align-self: flex-end;
        font-size: 11px;
        color: var(--muted);
        padding-right: 4px;
        margin-bottom: 6px;
      }
      .receipt.err {
        color: var(--bad);
      }
      .cbar {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
      }
      .field {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 99px;
        padding: 8px 14px;
        color: var(--muted);
        font-size: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #send {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 0;
        padding: 0;
        background: var(--primary);
        color: var(--primary-fg);
        font: 700 20px var(--sans);
        text-align: center;
        flex: none;
      }
      #send:active {
        transform: scale(0.88);
      }

      /* ---- Design layer: calm depth, one accent, big type, gentle entrances (once per step). ---- */
      body { background: radial-gradient(120% 60% at 50% -10%, color-mix(in oklab, var(--primary) 16%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
      main { max-width: 680px; gap: 18px; padding-top: 22px; }
      main:has(.onepage) { max-width: 1200px; }
      header { background: color-mix(in oklab, var(--card) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 5; }
      h1 { font-size: clamp(28px, 7.5vw, 40px); line-height: 1.08; letter-spacing: -0.02em; font-weight: 800; text-wrap: balance; }
      .label { letter-spacing: 0.14em; color: color-mix(in oklab, var(--primary) 70%, var(--muted)); }
      .lead { font-size: 18px; }
      .card { border-radius: 20px; padding: 18px; background: linear-gradient(180deg, color-mix(in oklab, var(--card) 96%, var(--primary) 4%), var(--card)); box-shadow: 0 1px 0 color-mix(in oklab, var(--fg) 6%, transparent) inset, 0 10px 30px -18px rgb(0 0 0 / 0.5); }
      button, .findme a { border-radius: 16px; min-height: 56px; transition: transform 120ms ease, border-color 200ms ease, background 200ms ease; }
      button:active, .findme a:active { transform: scale(0.98); }
      button[aria-pressed="true"] { background: color-mix(in oklab, var(--primary) 18%, var(--card)); box-shadow: 0 0 0 2px var(--primary) inset; }
      .casecard b { font-size: 18px; }
      .locked { display: inline-flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 999px; background: color-mix(in oklab, var(--primary) 14%, var(--card)); color: var(--fg); justify-self: start; }
      .steps li b { font-size: 18px; }
      .timer { background: var(--card); }
      .timer.low { background: color-mix(in oklab, var(--primary) 22%, var(--card)); }
      .live { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in oklab, var(--good) 25%, transparent); flex: none; }
      body.offline .live { background: #f59e0b; box-shadow: 0 0 0 3px rgb(245 158 11 / 0.25); }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      body.enter #rest > *, body.enter #top > * { animation: rise 420ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      body.enter #rest > *:nth-child(2) { animation-delay: 60ms; } body.enter #rest > *:nth-child(3) { animation-delay: 120ms; } body.enter #rest > *:nth-child(n + 4) { animation-delay: 180ms; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chips i { font: 500 13px/1 var(--mono); font-style: normal; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--quiet); color: var(--fg); }
      .steps li { padding: 4px 0; } .steps li + li { border-top: 1px solid var(--line); padding-top: 12px; }
      .road { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
      .road li { position: relative; display: grid; gap: 2px; padding: 12px 0 12px 30px; color: var(--muted); transition: color 300ms ease; }
      .road li::before { content: ""; position: absolute; left: 6px; top: 16px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); transition: background 300ms ease, border-color 300ms ease; }
      .road li::after { content: ""; position: absolute; left: 11px; top: 32px; bottom: -14px; width: 2px; background: var(--line); }
      .road li:last-child::after { display: none; }
      .road li.on { color: var(--fg); } .road li.on::before { background: var(--primary); border-color: var(--primary); }
      .road li b { font-size: 17px; }
      .logline { margin: 0; padding: 12px; border-radius: 12px; background: var(--quiet); font: 12px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; }
      .small { font-size: 13px; }
      @media (prefers-reduced-motion: reduce) { .road li, .road li::before { transition: none; } }
      .pcard { opacity: 0.6; } .pcard.today { opacity: 1; box-shadow: 0 0 0 2px var(--primary) inset; } .pcard b { font-size: 20px; }
      .eyesup { position: fixed; inset: 0; z-index: 20; display: none; place-content: center; justify-items: center; gap: 12px; background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 26px; }
      .eyesup span { font-size: 64px; }
      body.eyes .eyesup { display: grid; }
      #nameform input { font: 600 20px var(--sans); padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
      a.cta { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font-weight: 600; text-decoration: none; }
      a.cta.primary-cta { min-height: 64px; font-size: 18px; background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      .me { display: flex; gap: 16px; align-items: center; } .me img { border-radius: 50%; flex: none; }
      .def { display: block; margin-top: 4px; font-weight: 400; font-size: 14px; color: var(--muted); }
      @media (prefers-reduced-motion: reduce) { body.enter #rest > *, body.enter #top > * { animation: none; } button, .findme a { transition: none; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brandrow">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-30 50 50)"><rect x="10" y="18" width="62" height="28" rx="14" fill="var(--mark-o)" /><rect x="28" y="54" width="62" height="28" rx="14" fill="var(--mark-g)" /></g></svg>
        <b>Workshops</b>
      </div>
      <button type="button" class="tbtn" id="termsBtn" aria-expanded="false" aria-controls="terms">Terms <span id="tcount">0</span></button>
      <span class="live" aria-hidden="true"></span><span id="where">Joining…</span><span class="score" id="score" hidden title="Right answers"></span><span class="timer" id="timer" hidden aria-live="off"></span>
      <div class="progress" aria-hidden="true"><i id="progress"></i></div>
    </header>
    <div class="eyesup" aria-live="assertive"><span>👀</span><b>Look at the screen</b></div>
    <main>
      <section id="gate" class="card" hidden aria-labelledby="gateTitle">
        <h1 id="gateTitle">Join the workshop</h1>
        <p id="gateMsg" role="status">Enter the 6-digit code from the big screen.</p>
        <form id="gateForm">
          <label for="code" class="label">Code</label>
          <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
          <button type="submit">Join</button>
        </form>
        <p id="gateHome" hidden>Find me: <a href="https://workshop.ofriperetz.dev">workshop.ofriperetz.dev</a></p>
      </section>
      <section id="terms" class="card" hidden aria-label="Terms so far"></section>
      <div id="top"></div>
      <section id="chat" aria-label="Chat with Dana">
        <div class="ctop">
          <div class="avatar" aria-hidden="true">D</div>
          <small>Dana</small>
        </div>
        <div id="msgs" aria-live="polite">
          <div class="spacer"></div>
          <div class="msg in">Landing at 6. Dinner still on?</div>
          <div class="msg out">Yes! Booked the table</div>
          <div class="msg in">Perfect. Text me when you leave</div>
        </div>
        <div class="cbar">
          <div class="field" id="field">Message</div>
          <button id="send" type="button" aria-label="Send">↑</button>
        </div>
      </section>
      <div id="rest"></div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const fmt = (ms) =>
        ms == null
          ? "—"
          : ms >= 1000
            ? (ms / 1000).toFixed(1) + " s"
            : Math.round(ms) + " ms";
      const dur = (min) =>
        min >= 1440
          ? `${Math.floor(min / 1440)} d ${((min % 1440) / 60).toFixed(1)} h`
          : min >= 60
            ? `${Math.floor(min / 60)} h ${Math.round(min % 60)} min`
            : min >= 1
              ? `${Math.floor(min)} min ${Math.round((min % 1) * 60)} s`
              : `${(min * 60).toFixed(1)} s`;
      async function post(path, data, headers = {}) {
        const r = await fetch(path, {
          method: "POST",
          headers: { "content-type": "application/json", ...headers },
          body: data === undefined ? undefined : JSON.stringify(data),
          credentials: "same-origin",
        });
        return {
          ok: r.ok,
          status: r.status,
          body: await r.json().catch(() => ({})),
        };
      }
      // One trace as a Gantt: phone spans in chart-2, server spans in chart-1, errors in red, the time
      // nobody owns dashed. (Same function in screen.html and phone.html.)
      function traceSvg(t, { w = 900, label = 190, row = 26, max } = {}) {
        max = max || t.total || 1;
        const rank = (s) => (s.gap ? 3 : s.depth === 0 ? 0 : s.side === "phone" ? 1 : s.depth === 1 ? 2 : 3);
        const rows = [...t.spans.map((s, i) => ({ ...s, i })), ...t.gaps.map((g) => ({ ...g, gap: true, name: "no span", depth: 2 }))]
          .sort((a, b) => rank(a) - rank(b) || a.start - b.start);
        const bars = w - label - 76, x = (ms) => label + (Math.min(ms, max) / max) * bars, H = 14 + rows.length * row + 18;
        const body = rows.map((s, k) => {
          const y = 8 + k * row, wid = Math.max(2, x(s.start + s.dur) - x(s.start));
          const fill = s.gap ? "none" : s.error ? "var(--bad)" : s.side === "phone" ? "var(--c2)" : "var(--c1)";
          return `<g ${s.gap ? "" : `data-span="${s.i}"`} style="cursor:${s.gap ? "default" : "pointer"}"><text x="${4 + s.depth * 12}" y="${y + row / 2}" ${s.gap ? 'style="fill:var(--bad)"' : ""}>${esc(s.name)}</text>
            <rect x="${x(s.start)}" y="${y + 3}" width="${wid}" height="${row - 9}" rx="4" fill="${fill}" ${s.gap ? 'stroke="var(--bad)" stroke-dasharray="5 3"' : ""}/>
            <text x="${w - 4}" y="${y + row / 2}" text-anchor="end" ${s.gap ? 'style="fill:var(--bad)"' : ""}>${fmt(s.dur)}</text></g>`;
        }).join("");
        return `<svg viewBox="0 0 ${w} ${H}" role="img" aria-label="Trace with ${t.spans.length} spans over ${fmt(t.total)}">${body}
          <line x1="${label}" x2="${label + bars}" y1="${H - 16}" y2="${H - 16}" stroke="var(--line)"/><text x="${label}" y="${H - 2}">0</text><text x="${label + bars}" y="${H - 2}" text-anchor="end">${fmt(max)}</text></svg>`;
      }
      // W3C Trace Context ids and the browser's own timing of each /api/send (Resource Timing)
      const hex = (n) => [...crypto.getRandomValues(new Uint8Array(n))].map((b) => b.toString(16).padStart(2, "0")).join("");
      performance.addEventListener?.("resourcetimingbufferfull", () => performance.clearResourceTimings()); // phones poll all session
      function phasesFor(t0) {
        const e = performance.getEntriesByType("resource").find((x) => x.name.endsWith("/api/send") && x.startTime >= t0 - 1);
        if (!e) return undefined;
        const r = (x) => Math.round(x * 10) / 10, ph = {};
        const add = (k, a, b) => { if (a > 0 && b > a) ph[k] = [r(a - e.startTime), r(b - a)]; };
        add("dns", e.domainLookupStart, e.domainLookupEnd);
        add("connect", e.connectStart, e.connectEnd);
        add("tls", e.secureConnectionStart, e.connectEnd);
        add("request", e.requestStart, e.responseStart);
        add("response", e.responseStart, e.responseEnd);
        return Object.keys(ph).length ? ph : undefined;
      }
      let view = null,
        local = {
          nines: null,
          slo: {},
          sent: 0,
          resent: 0,
          requests: { ok: 0, err: 0, last: null },
          load: { on: false, n: 0, last: null, pending: false, timer: null },
          span: 0,
        };

      // ---- chat: one persistent conversation across scenes -------------------------------------------
      const LINES = [
        "Leaving now",
        "Running 10 min late, order for me?",
        "Parking, 2 min",
        "Here!",
        "Where are you sitting?",
        "See you",
      ];
      let n = 0,
        pending = 0;
      $("field").textContent = LINES[0];
      function receipt(text, err) {
        $("msgs")
          .querySelectorAll(".receipt")
          .forEach((r) => r.remove());
        const r = document.createElement("div");
        r.className = "receipt" + (err ? " err" : "");
        r.textContent = text;
        $("msgs").append(r);
      }
      $("send").addEventListener("click", async () => {
        const again = pending > 0,
          text = LINES[(again ? n - 1 : n) % LINES.length];
        const b = document.createElement("div");
        b.className = "msg out pending" + (again ? " again" : "");
        b.textContent = text;
        $("msgs").append(b);
        receipt("Sending…");
        $("msgs").scrollTop = 1e9;
        if (!again) {
          n++;
          $("field").textContent = LINES[n % LINES.length];
        }
        pending++;
        local.sent++;
        if (again) local.resent++;
        const t0 = performance.now();
        try {
          const r = await post("/api/send", { again }, { traceparent: `00-${hex(16)}-${hex(8)}-01` });
          if (r.status === 429) {
            receipt("That's plenty for today", true);
            return;
          }
          b.classList.remove("pending");
          const ms = Math.round(performance.now() - t0);
          if (r.body.spans) post("/api/rtt", { ms, trace: r.body.trace, spans: r.body.spans, phases: phasesFor(t0) });
          else if (r.ok) post("/api/rtt", { ms });
          if (r.ok) {
            if (b === [...$("msgs").querySelectorAll(".msg.out")].at(-1))
              receipt("Delivered");
          } else {
            b.classList.add("failed");
            receipt("Not Delivered", true);
          }
        } catch {
          b.classList.add("failed");
          receipt("Not Delivered", true);
        } finally {
          pending--;
          $("msgs").scrollTop = 1e9;
        }
      });

      // ---- scene renderers -----------------------------------------------------------------------------
      function answer(value) {
        post("/api/answer", { value }).then((r) => {
          if (r.ok) {
            try { navigator.vibrate?.(12); } catch {}
            track(view?.type === "cases" ? "vote" : "answer", { step: view?.id });
            view.mine = value;
            render();
          }
        });
      }
      function leadHtml(v) {
        return v.lead ? `<p class="lead">${esc(v.lead)}</p>` : "";
      }
      const R = {
        why(v) {
          return `<span class="label">Why this matters</span><h1>${esc(v.why.title)}</h1><p class="lead">${esc(v.why.lead)}</p>`;
        },
        cases(v) {
          if (!v.study) return `<span class="label">Business use cases · you choose</span><h1>${esc(v.title)}</h1><div class="opts">${(v.cards || v.options.map((o) => ({ who: o, what: "" }))).map((c, i) => `<button type="button" class="casecard" data-a="${i}" aria-pressed="${v.mine === i}"><b>${esc(c.who)}</b><span>${esc(c.what)}</span></button>`).join("")}</div>${lockedIn(v)}`;
          const c = v.study;
          return `<span class="label">Case study</span><h1>${esc(c.who)}</h1><div class="card"><p><b>What happened:</b> ${esc(c.happened || c.what)}</p>${c.why ? `<p><b>Why:</b> ${esc(c.why)}</p>` : ""}${c.lesson ? `<p><b>The lesson:</b> ${esc(c.lesson)}</p>` : ""}<a href="${esc(c.source)}" rel="noopener">The source</a></div>`;
        },
        outro(v) {
          const L = Object.fromEntries(v.presenter.links.map((l) => [l.icon, l]));
          const a = (k, text, cls = "") => `<a class="cta ${cls}" href="${esc(L[k].href)}" target="_blank" rel="noopener" data-cta="${k}">${ICON[k] || ""}<span>${text}</span></a>`;
          return `<span class="label">Thanks for playing</span><h1>Now you can answer</h1><div class="card">${(v.answers || []).map((q) => `<p>→ ${esc(q)}</p>`).join("")}</div>
      ${a("linkedin", "Follow on LinkedIn", "primary-cta")}
      <div class="findme">${a("github", "Star on GitHub")}${a("devto", "Read the dev.to series")}</div>
      <p class="muted">Stuck on something at work? Ask me after, or message me on LinkedIn.</p>
      <span class="label">What should Step 2 cover?</span><div class="opts">${(v.options || []).map((o, i) => `<button type="button" data-a="${i}" aria-pressed="${v.mine === i}">${esc(o)}</button>`).join("")}</div>
      ${v.recap ? `<a class="cta" data-testid="recap-link" data-cta="recap" href="${esc(v.recap)}">Your recap</a>` : ""}`;
        },
        road(v) {
          const r = v.road, m = r.mine;
          roadBase = m ? { since: r.now - m.t, at: Date.now() } : null;
          const what = !m ? `<p class="muted">Send one and watch it travel.</p>`
            : r.mode === "logs" ? `<pre class="logline">${esc(JSON.stringify(m.line, null, 1))}</pre>`
            : `<p class="muted">trace_id <code>${esc(m.trace || "—")}</code></p>`;
          return `<span class="label">${r.mode === "logs" ? "Your log line" : "Your trace"}</span><h1>${esc(v.title)}</h1>
      <button type="button" class="primary" id="roadsend">Send a message</button>
      <ol class="road" id="road">${r.stages.map((st, i) => `<li data-at="${st.at}"><b>${esc(st.name)}</b><span>${esc(st.what)}</span></li>`).join("")}</ol>
      ${what}<p class="muted small">Typical delays, shown so you can see the road.</p>
      ${r.levels ? `<div class="card"><span class="label">Log levels</span>${r.levels.map(([k, d]) => `<p><b>${k}</b> · ${esc(d)}</p>`).join("")}</div>` : ""}`;
        },
        series(v) {
          const k = v.part ? v.part.n - 1 : -1;
          return `<span class="label">The monitoring series</span><h1>${esc(v.title)}</h1>
      <div class="opts">${v.series.map((x, i) => { const [n, name] = x.track.split(" · ");
        return `<div class="card pcard ${i === k ? "today" : ""}"><span class="label">Part ${esc(n)}${i === k ? " · today" : ""}</span><b>${esc(name)}</b><span class="muted">${esc(x.what)}</span></div>`; }).join("")}</div>`;
        },
        scan(v) {
          return `<span class="label">You're in</span><h1>Welcome to ${esc(v.workshop)}</h1><p class="lead">${esc(v.phone)}</p><p class="locked">✓ Connected · ${v.people} joined</p>`;
        },
        basics(v) {
          const r = v.results || {};
          return `<span class="label">Three words</span><h1>${esc(v.title)}</h1>
      <div class="card"><b>Latency</b><p>How long one request took. ${r.min != null ? `Yours: ${fmt(r.min)} to ${fmt(r.max)}.` : ""}</p></div>
      <div class="card"><b>Error rate</b><p>The share of requests that failed.</p></div>
      <div class="card"><b>Uptime</b><p>The share of time it worked, from outside.</p><p class="muted">99% ≈ 7 h down a month · 99.9% ≈ 43 min · 99.99% ≈ 4 min</p></div>`;
        },
        spread(v) {
          const r = v.results || {}, me = v.mineMs;
          const verdict = me == null ? "Send a message to see yours." : r.mean && me > 2 * r.mean ? "The average hides you. p95 finds you." : "The average describes you. Look who it hides.";
          return `<span class="label">Your wait vs the room</span><h1>${esc(v.title)}</h1>
      <div class="card"><div class="row"><span>Your typical wait</span><b>${fmt(me)}</b></div><div class="row"><span>Room average</span><b>${fmt(r.mean)}</b></div><div class="row"><span>Room p95</span><b>${fmt(r.p95)}</b></div></div>
      <p class="locked">${esc(verdict)}</p>`;
        },
        today(v) {
          const t = v.today;
          return `<span class="label">What we'll cover today</span><h1>${esc(v.workshop)}</h1><p class="lead">${esc(v.promise)}</p>
      <ol class="card steps">${t.parts.map((x) => `<li><b>${esc(x.name)}</b><span class="hook">${esc(x.hook)}</span>${x.terms.length ? `<span class="chips">${x.terms.map((term) => `<i>${esc(term)}</i>`).join("")}</span>` : ""}</li>`).join("")}</ol>`;
        },
        name(v) {
          return `<span class="label">One thing first</span><h1>What should we call you?</h1><p class="lead">Your first name shows on the leaderboard.</p>
      <form id="nameform" class="card"><input id="nameinput" name="name" maxlength="24" autocomplete="given-name" placeholder="First name" required /><button type="submit" class="primary">That's me</button></form>`;
        },
        waiting(v) {
                    return `<div class="onepage" data-testid="onepage">
      <div class="hero"><span class="label">${v.part ? `${esc(v.part.series)} · Part ${v.part.n} of ${v.part.of}` : "Workshop"} · ${v.minutes} min</span><h1>${esc(v.workshop)}</h1><p class="tag">${esc(v.promise)}</p>
        <p class="meta" data-testid="waiting-people">Starting soon · ${v.people} here</p></div>
      <div class="col">
        <section class="card host" style="order:1"><img class="avatar" src="${esc(v.host.photo)}" alt="${esc(v.host.name)}" width="72" height="72" /><div><span class="label">Your host</span><b>${esc(v.host.name)}</b><p class="meta">${esc(v.host.lead)}</p><ul>${v.host.items.map((it) => `<li>${esc(it)}</li>`).join("")}</ul></div></section>
      </div>
      <div class="col">
        <section class="card" style="order:2"><span class="label">What we'll do</span><ol>${v.parts.map((p) => `<li><b>${esc(p.name)}</b><span>${esc(p.q)}</span></li>`).join("")}</ol></section>
        <section class="card" style="order:3"><span class="label">You'll leave with</span><p>Your own numbers, real cases, a recap link, and one thing to check on Monday.</p></section>
        <div style="order:4">${findMe(v)}</div>
      </div>
    </div>`;
        },
        chat(v) {
          return `<h1>${esc(v.phone || v.title)}</h1>${v.group != null ? `<p class="card">Your messages took <b>${fmt(v.group)}</b> each.</p>` : ""}`;
        },
        poll(v) {
          const opts = v.options
            .map((o, i) => {
              const cls =
                v.answer !== undefined
                  ? i === v.answer
                    ? "right"
                    : "wrong"
                  : "";
              return `<button type="button" data-a="${i}" class="${cls}" aria-pressed="${v.mine === i}">${esc(o)}${v.defs?.[i] ? `<span class="def">${esc(v.defs[i])}</span>` : ""}</button>`;
            })
            .join("");
          const after =
            v.answer !== undefined
              ? `<p class="${v.mine === v.answer ? "ok" : "err"}"><b>${v.mine === undefined ? "Answer:" : v.mine === v.answer ? "You got it." : "Not quite."}</b> ${esc(v.options[v.answer])}</p>`
              : lockedIn(v);
          return `<h1>${esc(v.title)}</h1><div class="opts">${opts}</div>${after}${leadHtml(v)}${v.link ? `<a class="btn" href="${esc(v.link)}" target="_blank" rel="noopener">Open Relay's status page</a>` : ""}`;
        },
        gantt(v) {
          return R.poll(v);
        },
        fork(v) {
          if (v.chosen !== undefined)
            return `<span class="label">Your call</span><h1>The room has chosen.</h1><p>Look up — that's where we're going next.</p>`;
          return `<span class="label">Your call</span>` + R.poll(v);
        },
        show(v) {
          return `<h1>${esc(v.title)}</h1>${leadHtml(v)}<p>${esc(v.phone)}</p>`;
        },
        trace(v) {
          const t = v.trace, more = `<button type="button" class="primary" id="sendmore">Send Dana a message</button>`;
          if (!t) return `<h1>${esc(v.title)}</h1><p class="card">Send Dana a message, then look here.</p>${more}`;
          const s = t.spans[local.span] || t.spans[0], attrs = Object.entries(s.attrs || {});
          return `<h1>${esc(v.title)}</h1><span class="label">Trace ${esc(t.traceId.slice(0, 8))}… · ${fmt(t.total)}${t.ok ? "" : " · failed"}</span>
      <div class="card" id="tsvg">${traceSvg(t, { w: 380, label: 120, row: 24 })}</div>
      <div class="card"><span class="label">Span</span><b>${esc(s.name)}</b><div class="row"><span>Duration</span><b>${fmt(s.dur)}</b></div><div class="row"><span>Starts at</span><b>${fmt(s.start)}</b></div>
      <div class="row"><span>Parent</span><b>${esc(s.parent || "— (root)")}</b></div><div class="row"><span>Status</span><b class="${s.error ? "err" : ""}">${s.error ? "ERROR" : "OK"}</b></div>
      ${attrs.map(([k, x]) => `<div class="row"><span>${esc(k)}</span><b>${esc(x)}</b></div>`).join("")}</div>${leadHtml(v)}<p>${esc(v.phone)}</p>${more}`;
        },
        stat(v) {
          return `<h1>${esc(v.title)}</h1><div class="card"><div class="row"><span>Messages you sent</span><b>${local.sent}</b></div><div class="row"><span>Sent again while waiting</span><b>${local.resent}</b></div></div><p>${esc(v.phone)}</p>`;
        },
        journey(v) {
          if (!v.last)
            return `<h1>${esc(v.title)}</h1><p class="card">Send Dana one more message, then look here.</p>`;
          const net = Math.max(0, v.last.rtt - v.last.server),
            sw = (100 * v.last.server) / Math.max(1, v.last.rtt);
          return `<h1>${esc(v.title)}</h1><div class="card"><span class="label">Response time — what you waited</span><span class="big">${fmt(v.last.rtt)}</span>
      <div class="split" aria-hidden="true"><i class="s" style="width:${sw}%"></i><i class="n" style="width:${100 - sw}%"></i></div>
      <div class="row"><span>Inside Relay (service time)</span><b>${fmt(v.last.server)}</b></div><div class="row"><span>Network, gateway, waiting</span><b>${fmt(net)}</b></div></div>${leadHtml(v)}`;
        },
        dots(v) {
          return `<h1>${esc(v.title)}</h1>${v.worst != null ? `<div class="card"><span class="label">Your slowest message</span><span class="big">${fmt(v.worst)}</span><p>${v.faster}% of the room's messages were faster.</p></div>` : `<p class="card">Your messages will show up here once you've sent one.</p>`}${leadHtml(v)}`;
        },
        metrics(v) {
          const more = `<button type="button" class="primary" id="sendmore">Send Dana a message</button>`;
          return `<h1>${esc(v.title)}</h1><p>${esc(v.phone)}</p>${more}
      <div class="card"><span class="label">Counter · your messages</span><span class="big">${v.mySent ?? 0}</span>
      <div class="row"><span>Of them failed</span><b class="${v.myErrors ? "err" : ""}">${v.myErrors ?? 0}</b></div><div class="row"><span>The room's counter</span><b>${v.roomTotal ?? 0}</b></div></div>
      <div class="card"><span class="label">Histogram → p95</span><div class="row"><span>Your p95</span><b>${fmt(v.myP95)}</b></div><div class="row"><span>The room's p95</span><b>${fmt(v.roomP95)}</b></div></div>
      <a class="btn" href="/api/metrics" target="_blank" rel="noopener">See the raw /metrics page a scraper reads</a>${leadHtml(v)}`;
        },
        logs(v) {
          const more = `<button type="button" class="primary" id="sendmore">Send Dana a message</button>`;
          const lines = local.allLogs ? v.lines : v.myLines;
          const slow = (v.myLines || []).reduce((a, b) => ((b.duration_ms ?? 0) > (a?.duration_ms ?? -1) ? b : a), null);
          const row = (l) => `<code class="logline ${l.level}${slow && l.trace_id === slow.trace_id ? " slow" : ""}">${esc(JSON.stringify({ time: l.time.slice(11, 23), level: l.level, status: l.status, duration_ms: l.duration_ms, client: l.client, trace_id: l.trace_id && l.trace_id.slice(0, 12) + "…" }))}</code>`;
          return `<h1>${esc(v.title)}</h1><p>${esc(v.phone)}</p><div class="card"><span class="label">Your client id</span><span class="big">${esc(v.client)}</span></div>${more}
      <button type="button" id="alllogs" aria-pressed="${!!local.allLogs}">${local.allLogs ? "Show only my lines" : "Show the whole room's log"}</button>
      <div class="card logs">${lines && lines.length ? lines.map(row).join("") : "<p>No lines yet. Send a message.</p>"}</div>
      ${slow ? `<p>Your slowest: <b>${fmt(slow.duration_ms)}</b>, trace <code>${esc((slow.trace_id || "").slice(0, 12))}…</code></p>` : ""}${leadHtml(v)}`;
        },
        fanout(v) {
          const j = v.job;
          return `<h1>${esc(v.title)}</h1><button type="button" class="primary" id="job">Run a job · ${v.calls} calls</button>
      ${j ? `<div class="card"><span class="label">Your last job</span><span class="big ${j.slow ? "err" : "ok"}">${j.slow ? "Slow" : "Fast"}</span><p>${j.slowCalls} of ${v.calls} calls were slow${j.slow ? ", so the whole job waited for it." : "."}</p></div>` : ""}${leadHtml(v)}`;
        },
        requests(v) {
          const r = local.requests;
          return `<h1>${esc(v.title)}</h1><button type="button" class="primary" id="req">Send a request</button>
      <div class="card"><span class="label">Last response</span><span class="big ${r.last === 200 ? "ok" : r.last ? "err" : ""}">${r.last ?? "—"}</span>
      <div class="row"><span>Worked</span><b>${r.ok}</b></div><div class="row"><span>Failed</span><b>${r.err}</b></div>
      <div class="row"><span>Your uptime</span><b>${r.ok + r.err ? ((100 * r.ok) / (r.ok + r.err)).toFixed(1) + "%" : "—"}</b></div></div>${leadHtml(v)}`;
        },
        nines(v) {
          const pick = local.nines ?? v.mine;
          const chips = v.nines
            .map(
              (x) =>
                `<button type="button" data-n="${x}" aria-pressed="${pick === x}">${x}%</button>`,
            )
            .join("");
          const down =
            pick == null
              ? ""
              : `<div class="card"><span class="label">${pick}% allows this much downtime</span>
      <div class="row"><span>Per year</span><b>${dur(525600 * (1 - pick / 100))}</b></div><div class="row"><span>Per month</span><b>${dur(43200 * (1 - pick / 100))}</b></div><div class="row"><span>Per day</span><b>${dur(1440 * (1 - pick / 100))}</b></div></div>`;
          return `<h1>${esc(v.title)}</h1><div class="chips">${chips}</div>${down}${leadHtml(v)}`;
        },
        slo(v) {
          const m = local.slo,
            chosen = v.slo.chosen;
          const chip = (key, x, lbl) =>
            `<button type="button" data-${key}="${x}" aria-pressed="${m[key] === x}">${lbl}</button>`;
          return `<h1>${esc(v.title)}</h1><div class="card"><span class="label">Share of messages</span><div class="chips">${v.slo.pct.map((x) => chip("pct", x, x + "%")).join("")}</div>
      <span class="label">Delivered within</span><div class="chips">${v.slo.ms.map((x) => chip("ms", x, fmt(x))).join("")}</div></div>
      ${m.pct && m.ms ? `<p class="lead">"${m.pct}% of messages are delivered within ${fmt(m.ms)}, over 28 days."</p>` : ""}
      ${chosen ? `<div class="card"><span class="label">The room chose</span><b>${chosen.pct}% within ${fmt(chosen.ms)}</b></div>` : ""}`;
        },
        load(v) {
          const L = local.load;
          const ctrl =
            v.mode === "closed"
              ? `<button type="button" class="primary" id="ld" ${L.pending ? "disabled" : ""}>${L.pending ? "Waiting for Relay…" : "Send"}</button>`
              : `<label class="card switch"><span>Send every second</span><input type="checkbox" id="ldsw" ${L.on ? "checked" : ""}></label>`;
          return `<h1>${esc(v.title)}</h1>${ctrl}<div class="card"><div class="row"><span>Requests you sent</span><b>${L.n}</b></div><div class="row"><span>Last answer took</span><b>${fmt(L.last)}</b></div></div>${leadHtml(v)}`;
        },
        intro(v) {
          const who = v.intro === "returning" ? `<p class="lead">Welcome back</p>` : `<p class="lead">${esc(v.lead)}</p><div class="card">${v.items.map((it) => `<p>${esc(it)}</p>`).join("")}</div>`;
          return `<div class="me"><img src="${esc(v.presenter.photo)}" alt="${esc(v.presenter.name)}" width="88" height="88" /><div><span class="label">Your host</span><h1>${esc(v.presenter.name)}</h1></div></div>${who}${findMe(v)}`;
        },
        next(v) {
          return `<span class="label">Coming up</span><h1>${esc(v.title)}</h1><div class="card">${v.items.map((it) => `<p>→ ${esc(it)}</p>`).join("")}</div><p>${esc(v.phone)}</p>`;
        },
        qa(v) {
          return `<span class="label">${esc(v.workshop)}</span><h1>${esc(v.title)}</h1><p>${esc(v.phone)}</p>${v.recap ? `<a class="btn" data-testid="recap-link" href="${esc(v.recap)}">Today's recap</a>` : ""}${findMe(v)}`;
        },
        takeaway(v) {
          const opts = v.items.map((it, i) => `<button type="button" data-a="${i}" aria-pressed="${v.mine === i}">${esc(it)}</button>`).join("");
          const after = v.followup
            ? `<div class="card" data-testid="followup"><b>In a week we'll ask: did you?</b><a class="btn" href="${esc(v.followup)}">Add a reminder</a></div>`
            : `<p>Pick the one you'll do this week.</p>`;
          return `<h1>${esc(v.title)}</h1><div class="opts">${opts}</div>${after}${v.recap ? `<a class="btn" data-testid="recap-link" href="${esc(v.recap)}">Today's recap</a>` : ""}`;
        },
      };

      let lastKey = "", roadBase = null;
      function live(v) { // the in-place updates
        setTimer(v.timer);
        $("score").hidden = !v.points;
        if (v.points) $("score").textContent = `★ ${v.points.toLocaleString()} · #${v.rank}`;
        document.body.classList.toggle("eyes", !!v.eyes);
        const t = document.querySelector("[data-tally]");
        if (t && v.tally) t.textContent = `${v.tally.done} of ${v.tally.of}`;
        if (v.road) roadBase = v.road.mine ? { since: v.road.now - v.road.mine.t, at: Date.now() } : null;
      }
      // Light each stage of the road as this phone's latest message reaches it.
      setInterval(() => {
        const el = document.getElementById("road");
        if (!el) return;
        const since = roadBase ? roadBase.since + (Date.now() - roadBase.at) : -1;
        el.querySelectorAll("li").forEach((li) => li.classList.toggle("on", since >= +li.dataset.at));
      }, 200);
      function render() {
        const v = view;
        if (!v) return;
        setTimer(v.timer);
        $("where").textContent = v.act;
        $("progress").style.width = v.type === "waiting" ? "0%" : `${Math.round((100 * (v.i + 1)) / v.n)}%`;
        $("score").hidden = !v.points;
        if (v.points) $("score").textContent = `★ ${v.points.toLocaleString()} · #${v.rank}`;
        document.body.classList.toggle("eyes", !!v.eyes);
        terms(v.terms);
        if (v.needName && document.getElementById("nameform")) return; // don't redraw under someone typing their name
        $("chat").classList.toggle("on", v.type === "chat");
        const key = `${v.id}:${v.shown}`;
        document.body.classList.toggle("enter", key !== lastKey);
        lastKey = key;
        const html = v.needName ? R.name(v) : (R[v.type] || ((x) => `<h1>${esc(x.title)}</h1>`))(v) + (v.case ? `<p class="card" data-testid="case"><span class="label">${v.case.real ? "Case" : "Example"}</span> <b>${esc(v.case.who.replace(/^Example: /, ""))}:</b> ${esc(v.case.happened || v.case.what)}${v.case.bridge ? `<br><b>→ ${esc(v.case.bridge)}</b>` : ""}</p>` : "") + (v.remember ? `<p class="card" data-testid="remember"><span class="label">Remember</span> <b>${esc(v.remember)}</b></p>` : "");
        if (v.type === "chat") {
          $("top").innerHTML = html;
          $("rest").innerHTML = "";
        } else {
          $("top").innerHTML = "";
          $("rest").innerHTML = html;
        }
        if (!NO_DEEPER.has(v.type) && !v.needName)
          $("rest").insertAdjacentHTML("beforeend", `<button type="button" class="deeper" id="deeper" ${v.curiousMine ? "disabled" : ""}>${v.curiousMine ? "🔍 Noted — thanks" : "🔍 Go deeper on this"}</button>`);
        const nf = $("nameform");
        if (nf) nf.onsubmit = async (e) => {
          e.preventDefault();
          const r = await post("/api/name", { name: $("nameinput").value });
          if (r.ok) { try { const k = JSON.parse(localStorage.getItem("relay-session") || "{}"); localStorage.setItem("relay-session", JSON.stringify({ ...k, name: $("nameinput").value.trim() })); } catch {} const x = await fetch("/api/view", { cache: "no-store" }); if (x.ok) { view = await x.json(); render(); } }
          else nf.insertAdjacentHTML("beforeend", `<p class="err">${esc(r.body.error || "Try again.")}</p>`);
        };
        const rs = $("roadsend");
        if (rs) rs.onclick = async () => {
          rs.disabled = true;
          try { await post("/api/send", {}, { traceparent: `00-${hex(16)}-${hex(8)}-01` }); const r = await fetch("/api/view", { cache: "no-store" }); if (r.ok) { view = await r.json(); render(); } } finally { rs.disabled = false; }
        };
        wire(v);
      }
      // After a choice: locked in, and how much of the room has chosen. Change your mind any time before the reveal.
      const lockedIn = (v) => v.mine === undefined ? (v.tally ? `<p class="muted"><span data-tally>${v.tally.done} of ${v.tally.of}</span> chose so far</p>` : "")
        : `<p class="locked">✓ Locked in${v.tally ? ` · <span data-tally>${v.tally.done} of ${v.tally.of}</span> chose` : ""}. Tap another to change.</p>`;
      // Brand marks for the link buttons (Simple Icons paths; the blog uses a plain pen).
      const ICON = {
        linkedin: '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path fill="currentColor" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
        devto: '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path fill="currentColor" d="M7.42 10.05c-.18-.16-.46-.23-.84-.23H6l.02 2.44.04 2.45.56-.02c.41 0 .63-.07.83-.26.24-.24.26-.36.26-2.2 0-1.91-.02-1.96-.29-2.18zM0 4.94v14.12h24V4.94H0zM8.56 15.3c-.44.58-1.06.77-2.53.77H4.71V8.53h1.4c1.67 0 2.16.18 2.6.9.27.43.29.6.32 2.57.05 2.23-.02 2.73-.47 3.3zm5.09-5.47h-2.47v1.77h1.52v1.28l-.72.04-.75.03v1.77l1.22.03 1.2.04v1.28h-1.6c-1.53 0-1.6-.01-1.87-.3l-.3-.28v-3.16c0-3.02.01-3.18.25-3.48.23-.31.25-.31 1.88-.31h1.64v1.3zm4.68 5.45c-.17.43-.64.79-1 .79-.18 0-.45-.15-.67-.39-.32-.32-.45-.63-.82-2.08l-.9-3.39-.45-1.67h.76c.4 0 .75.02.75.05 0 .06 1.16 4.54 1.26 4.83.04.15.32-.7.73-2.3l.66-2.52.74-.04c.4-.02.73 0 .73.04 0 .14-1.67 6.38-1.8 6.68z"/></svg>',
        github: '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
        blog: '<svg viewBox="0 0 24 24" aria-hidden="true" class="ico" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      };
      const findMe = (v) =>
        `<nav class="findme" aria-label="${esc(v.presenter.name)} elsewhere">${v.presenter.links.map((l) => `<a href="${esc(l.href)}" target="_blank" rel="noopener" data-cta="${esc(l.icon)}">${ICON[l.icon] || ""}<span>${esc(l.cta || l.label)}</span></a>`).join("")}</nav>`;
      const NO_DEEPER = new Set(["intro", "series", "scan", "why", "today", "road", "qa", "waiting", "cases", "outro", "fork", "next", "takeaway"]);
      // Terms: every term taught so far, kept on this phone after the session (convenience only)
      function terms(list) {
        let kept = {};
        try {
          kept = JSON.parse(localStorage.getItem("relay-terms") || "{}");
        } catch {}
        for (const t of list || []) kept[t.term] ??= { def: t.def, example: t.example };
        try {
          localStorage.setItem("relay-terms", JSON.stringify(kept));
        } catch {}
        const names = Object.keys(kept);
        $("tcount").textContent = names.length;
        $("terms").innerHTML = `<span class="label">Terms so far</span><dl>${names.map((n) => `<div><dt>${esc(n)}</dt><dd>${esc(kept[n].def)}${kept[n].example ? ` <i>${esc(kept[n].example)}</i>` : ""}</dd></div>`).join("")}</dl>`;
      }
      $("termsBtn").onclick = () => {
        const s = $("terms");
        s.hidden = !s.hidden;
        $("termsBtn").setAttribute("aria-expanded", String(!s.hidden));
      };
      function wire(v) {
        const all = $("alllogs");
        if (all) all.onclick = () => { local.allLogs = !local.allLogs; render(); };
        const more = $("sendmore");
        if (more) more.onclick = () => $("send").click(); // the chat is hidden here; its Send still works
        document.querySelectorAll("#tsvg [data-span]").forEach((g) => (g.onclick = () => { local.span = +g.dataset.span; render(); }));
        const deeper = $("deeper");
        if (deeper)
          deeper.onclick = async () => {
            deeper.disabled = true;
            const r = await post("/api/curious");
            if (r.ok || r.status === 409) view.curiousMine = true;
            render();
          };
        document
          .querySelectorAll("[data-a]")
          .forEach(
            (b) =>
              (b.onclick = () =>
                v.answer === undefined && answer(+b.dataset.a)),
          );
        document.querySelectorAll("[data-n]").forEach(
          (b) =>
            (b.onclick = () => {
              local.nines = +b.dataset.n;
              answer(local.nines);
              render();
            }),
        );
        document.querySelectorAll("[data-pct],[data-ms]").forEach(
          (b) =>
            (b.onclick = () => {
              if (b.dataset.pct) local.slo.pct = +b.dataset.pct;
              else local.slo.ms = +b.dataset.ms;
              if (local.slo.pct && local.slo.ms)
                answer({ pct: local.slo.pct, ms: local.slo.ms });
              render();
            }),
        );
        const job = $("job");
        if (job)
          job.onclick = async () => {
            job.disabled = true;
            const r = await post("/api/job");
            if (r.ok) view.job = r.body;
            render();
          };
        const req = $("req");
        if (req)
          req.onclick = async () => {
            const r = await post("/api/request");
            local.requests.last = r.status;
            r.ok ? local.requests.ok++ : local.requests.err++;
            render();
          };
        const ld = $("ld");
        if (ld) ld.onclick = () => loadOnce();
        const sw = $("ldsw");
        if (sw)
          sw.onchange = () => {
            local.load.on = sw.checked;
            clearInterval(local.load.timer);
            if (sw.checked) local.load.timer = setInterval(loadOnce, 1000);
          };
      }
      async function loadOnce() {
        const L = local.load;
        L.pending = true;
        if (view.mode === "closed") render();
        const t0 = performance.now();
        const r = await post("/api/load");
        L.pending = false;
        if (r.ok) {
          L.n++;
          L.last = Math.round(performance.now() - t0);
        }
        if (view.type === "load") render();
      }

      // The room is closed unless the presenter opened it. The QR carries the code (?c=); typing the
      // address asks for it.
      const gate = (msg, askCode) => {
        $("gate").hidden = false;
        $("gateForm").hidden = !askCode;
        $("gateHome").hidden = askCode;
        $("gateTitle").textContent = askCode ? "Join the workshop" : "Not running right now";
        $("gateMsg").textContent = msg;
        $("chat").hidden = true;
        $("where").textContent = askCode ? "Code needed" : "Closed";
      };
      // ---- Measurement: our own event log always; PostHog too when the deployment has a key. Never a name or an IP.
      let ph = null;
      const track = (event, props = {}) => { try { ph?.capture(event, props); } catch {} };
      fetch("/api/config").then((r) => r.json()).then((c) => {
        if (!c.posthog) return;
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/posthog-js@1.200.2/dist/array.full.js";
        sc.onload = () => { window.posthog.init(c.posthog.key, { api_host: c.posthog.host, person_profiles: "identified_only", autocapture: false, capture_pageview: false, persistence: "localStorage" }); ph = window.posthog; track("scan"); };
        document.head.appendChild(sc);
      }).catch(() => {});
      post("/api/scan", {}).catch(() => {});
      setInterval(() => { if (document.visibilityState === "visible" && view) { post("/api/event", { type: "beat" }).catch(() => {}); } }, 30_000);
      addEventListener("pagehide", () => track("leave", { step: view?.id }));
      document.addEventListener("click", (e) => { // calls to action: counted, then followed
        const a = e.target.closest("a[data-cta]");
        if (!a) return;
        post("/api/event", { type: "cta", target: a.dataset.cta }).catch(() => {});
        track("cta_click", { target: a.dataset.cta });
      });
      // Coming back: the last session is offered for 3 hours (this browser only).
      const SESSION_TTL = 3 * 3600_000;
      const savedSession = () => { try { const x = JSON.parse(localStorage.getItem("relay-session") || "null"); return x && x.until > Date.now() ? x : null; } catch { return null; } };
      const saveSession = (patch) => { try { localStorage.setItem("relay-session", JSON.stringify({ ...savedSession(), ...patch, until: Date.now() + SESSION_TTL })); } catch {} };
      let joinCode = new URLSearchParams(location.search).get("c") || (() => { try { return sessionStorage.getItem("relay-code"); } catch { return null; } })();
      const join = (code) =>
        post("/api/join", code ? { code } : {}).then((r) => {
          if (r.ok) {
            if (code) { joinCode = code; try { sessionStorage.setItem("relay-code", code); } catch {} }
            const back = !!savedSession();
            saveSession({ code: joinCode, workshop: r.body.workshop });
            track(back ? "rejoin" : "join", { workshop: r.body.workshop });
            $("gate").hidden = true;
            $("chat").hidden = false;
            if (location.search) history.replaceState(null, "", location.pathname);
            return enter(r);
          }
          gate(r.body.error || "Couldn't join. Reload to try again.", r.body.needCode === true);
          const prev = savedSession();
          if (r.body.needCode && prev?.code && prev.code !== code) { // offer the session this phone was in
            $("gateMsg").insertAdjacentHTML("afterend", `<button type="button" class="primary" id="rejoin">Rejoin ${esc(prev.workshop || "your workshop")}${prev.name ? ` as ${esc(prev.name)}` : ""}</button>`);
            $("rejoin").onclick = () => join(prev.code);
          }
          if (r.body.needCode) $("code").focus();
        });
      $("gateForm").addEventListener("submit", (e) => {
        e.preventDefault();
        join($("code").value.trim());
      });
      join(new URLSearchParams(location.search).get("c"))
        .catch(() => {
          $("where").textContent = "Offline — reload";
        });
      function enter(r) {
        {
          view = r.body;
          render();
          // Redraw only when what's on screen changes: a rebuild under a finger loses the tap. Live
          // numbers (countdown, how many chose, points) update in place.
          const VOLATILE = new Set(["timer", "tally", "people", "now", "counts", "points", "rank", "of", "score"]);
          const shape = (v) => JSON.stringify(v, (k, x) => (VOLATILE.has(k) ? undefined : x));
          let lastShape = "";
          const apply = (next) => {
            const sig = shape(next);
            if (sig === lastShape && view) { view = next; live(next); return; }
            lastShape = sig;
            if (next.type !== "load") {
              clearInterval(local.load.timer);
              local.load.on = false;
            }
            if (view && next.id !== view.id) { window.scrollTo(0, 0); local.span = 0; track("step_view", { step: next.id, type: next.type }); }
            view = next;
            render();
          };
          const poll = async () => { // every phone checks in; 1.5 s keeps 60 phones at ~40 req/s
            try {
              const r = await fetch("/api/view", { cache: "no-store", credentials: "same-origin" });
              if (r.status === 403) return gate("The presenter closed the workshop. Thanks for joining.", false);
              if (r.status === 401 && joinCode) { // our session is gone (e.g. the room restarted): rejoin quietly
                const again = await post("/api/join", { code: joinCode });
                if (again.ok) { apply(again.body); setTimeout(poll, 1500); return; }
              }
              if (r.ok) apply(await r.json());
            } catch {}
            setTimeout(poll, 1500);
          };
          setTimeout(poll, 1500);
          // Push: the presenter's Next reaches this phone at once; polling above is the fallback.
          if (window.EventSource) {
            const es = new EventSource("/api/stream");
            es.onopen = () => document.body.classList.remove("offline");
            es.onerror = () => document.body.classList.add("offline"); // EventSource retries by itself
            es.addEventListener("step", async () => {
              try { const r = await fetch("/api/view", { cache: "no-store", credentials: "same-origin" }); if (r.ok) apply(await r.json()); } catch {}
            });
          }
        }
      }
    
      // The countdown: the server says how much is left; this page counts down from when it heard it.
      let deadline = null;
      function setTimer(t) { deadline = t ? { at: Date.now() + t.left, total: t.total } : null; tick(); }
      function tick() {
        const el = document.getElementById("timer");
        if (!el) return;
        if (!deadline) { el.hidden = true; return; }
        const left = Math.max(0, deadline.at - Date.now()), sec = Math.ceil(left / 1000);
        el.hidden = false;
        el.textContent = left ? `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}` : "Time";
        el.classList.toggle("low", left > 0 && left <= 30_000);
        el.classList.toggle("done", left === 0);
      }
      setInterval(tick, 1000);
</script>
