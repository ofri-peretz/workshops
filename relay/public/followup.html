<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Did you do it?</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Where the QR lands: one column of big links, read in a second. Same tokens as the phone. */
      :root {
        --bg: #faf7f4;
        --card: #fff;
        --fg: #0d0b09;
        --muted: #4d453c;
        --line: #eae7e2;
        --primary: #7d350c;
        --primary-fg: #fff;
        --mark-o: #a84c17;
        --mark-g: #0a6b47;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171412;
          --fg: #f0ede9;
          --muted: #c9c3bb;
          --line: #252019;
          --primary: #fbb99a;
          --primary-fg: #0a0a0a;
          --mark-o: #f4794a;
          --mark-g: #0d9460;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 var(--sans); }
      main {
        display: grid;
        gap: 28px;
        justify-items: center;
        max-width: 480px;
        margin: 0 auto;
        padding-block: max(48px, env(safe-area-inset-top)) 48px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        text-align: center;
      }
      .mark { width: 72px; height: 72px; }
      h1 { font-size: 30px; line-height: 1.1; margin: 8px 0 4px; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--muted); }
      nav { display: grid; gap: 12px; width: 100%; }
      nav a {
        display: grid;
        place-items: center;
        min-height: 56px;
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        font-weight: 600;
        text-decoration: none;
      }
      nav a:first-child { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      nav a:hover, nav a:focus-visible { border-color: var(--primary); }
      section { display: grid; gap: 6px; width: 100%; border-top: 1px solid var(--line); }
      .label { font: 600 12px/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-top: 20px; }
      ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
      li { color: var(--muted); font-size: 15px; }
      li b { color: var(--fg); font-weight: 600; }
      footer { font-size: 14px; }
      footer a { color: var(--primary); }
    </style>
    <style>
      main { justify-items: stretch; text-align: left; }
      h1, header p { text-align: center; }
      .card { display: grid; gap: 6px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
      .row { display: flex; justify-content: space-between; gap: 12px; }
      .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
      dt { font-weight: 600; color: var(--fg); } dd { margin: 0 0 8px; color: var(--muted); }
      .actions { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      button { min-height: 56px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 600 17px var(--sans); }
      button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-30 50 50)"><rect x="10" y="18" width="62" height="28" rx="14" fill="var(--mark-o)" /><rect x="28" y="54" width="62" height="28" rx="14" fill="var(--mark-g)" /></g></svg><h1>Did you do it?</h1><p id="pick"></p></header>
      <div class="actions" id="ask" hidden><button type="button" class="primary" data-did="true">Yes</button><button type="button" data-did="false">Not yet</button></div>
      <p id="msg" role="status"></p>
      <footer><a href="/">Ofri Peretz · all workshops and links</a></footer>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const ms = (x) => (x == null ? "—" : x < 1000 ? Math.round(x) + " ms" : (x / 1000).toFixed(1) + " s");
      const Q = new URLSearchParams(location.search);
      const signed = Q.get("p") && Q.get("k") ? `&p=${encodeURIComponent(Q.get("p"))}&k=${encodeURIComponent(Q.get("k"))}` : "";
      const api = `/api/followup?${signed.slice(1)}`;
      const thanks = (did) => ($("msg").textContent = did ? "Nice. That's what the workshop was for." : "No problem. It's still the one thing to do.");
      (async () => {
        const r = await fetch(api).catch(() => null);
        if (!r || !r.ok) { $("msg").textContent = "This link isn't valid. Use the one from your phone."; return; }
        const v = await r.json();
        $("pick").textContent = v.pick;
        if (v.done !== null) return thanks(v.done);
        $("ask").hidden = false;
        document.querySelectorAll("[data-did]").forEach((b) => (b.onclick = async () => {
          const did = b.dataset.did === "true";
          const s = await fetch(api, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ did }) });
          $("ask").hidden = true;
          if (s.ok || s.status === 409) thanks(did); else $("msg").textContent = "Couldn't save that. Try again later.";
        }));
      })();
    </script>
  </body>
</html>
